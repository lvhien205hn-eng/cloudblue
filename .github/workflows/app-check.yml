# KIỂM THỬ app Android + app PC trên nhánh app-next (KHÔNG phát hành gì: không ký khoá thật, không đẩy CH Play, không đưa file lên web).
# Đẩy lên main mới chạy 2 workflow phát hành (android-app.yml, pc-client.yml) như cũ.
# App PC: chụp ảnh giao diện (máy chủ giả, Windows thật) → nhánh app-shots (chỉ chứa ảnh) để soát giao diện.
# Nhánh app-shots kèm blueroblox-site/vercel.json {"git":{"deploymentEnabled":false}} → Vercel không tạo bản xem thử (khỏi tốn lượt deploy 100/ngày).
name: Check apps (app-next)

on:
  push:
    branches: [app-next]
  workflow_dispatch:

permissions:
  contents: write          # chỉ để đẩy ảnh chụp giao diện vào nhánh app-shots

concurrency:
  group: app-check
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK (web, debug - chi de kiem bien dich)
        env:
          APP_VERSION_CODE: "1"
        run: gradle -p android-app assembleWebDebug assemblePlayDebug --no-daemon --stacktrace

  proxy:                   # 22/11 · 🌐 proxy riêng từng Cloud Phone: cbproxy (Go, chạy trong máy Android) + phonectl + cpapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: cbproxy - dựng lại từ mã nguồn phải ra đúng file windows/cbproxy-x86_64 (md5 ghim trong phonectl)
        working-directory: cbproxy
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w -buildid=" -o /tmp/cbproxy-x86_64 .
          want=$(grep -oP 'CBPX_FILE = \("cbproxy-x86_64", "\K[0-9a-f]{32}' ../windows/phonectl.py)
          echo "md5 ghim: $want"; md5sum /tmp/cbproxy-x86_64 ../windows/cbproxy-x86_64
          test "$(md5sum < ../windows/cbproxy-x86_64 | cut -c1-32)" = "$want"
          test "$(md5sum < /tmp/cbproxy-x86_64 | cut -c1-32)" = "$want"
      - name: cbproxy trong mạng giả (iptables thật, root)
        run: |
          cp windows/cbproxy-x86_64 /tmp/cbproxy-run && chmod 755 /tmp/cbproxy-run     # tải lên qua web GitHub thì file không có quyền chạy
          sudo python3 cbproxy/test_cbproxy.py /tmp/cbproxy-run
      - name: phonectl + cpapi (proxy)
        run: python3 cbproxy/test_proxy_server.py

  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + selftest exe
        shell: pwsh
        working-directory: pc-client
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller av pygame-ce numpy pillow
          python -m py_compile bluepc.py brstream.py
          python ..\.github\app-check\test_pc_viewer.py .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python ..\.github\app-check\test_pc_mini.py .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller --noconfirm --clean --windowed --name CloudBluePC --collect-submodules av bluepc.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $st = Join-Path $PWD "selftest.txt"
          Start-Process -FilePath dist/CloudBluePC/CloudBluePC.exe -ArgumentList "--selftest", "`"$st`"" -Wait -NoNewWindow
          if (-not (Test-Path $st)) { Write-Error "exe khong chay duoc"; exit 1 }
          Get-Content $st
          if ((Get-Content $st -TotalCount 1) -ne "OK") { exit 1 }
      - name: Chụp ảnh giao diện app PC (máy chủ giả)
        shell: pwsh
        working-directory: pc-client
        run: |
          python ..\.github\app-check\shot_pc.py . ..\shots vi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python ..\.github\app-check\shot_pc.py . ..\shots en
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Lưu ảnh vào nhánh app-shots
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan app-shots-tmp
          git rm -r -q --cached .
          New-Item -ItemType Directory -Force blueroblox-site | Out-Null
          Set-Content -Path blueroblox-site/vercel.json -Value '{"git":{"deploymentEnabled":false}}' -Encoding ascii
          git add shots blueroblox-site/vercel.json
          git commit -q -m "Anh giao dien app PC ($env:GITHUB_SHA)"
          git push -f origin HEAD:refs/heads/app-shots
