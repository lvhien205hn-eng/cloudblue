# 27/11e · ANDROID 9 (LDPlayer 9) PHÁT HÌNH — (1) logic mới của bluestream (test_a9logic.py, không cần máy Android) · (2) đo bộ nén trong máy (Android 9: OMX.google.h264.encoder, giống LD9) qua scrcpy-server 2.4:
#   khung I định kỳ có cờ "khoá" / có phải IDR không · màn đứng yên có lặp khung không · khung/giây theo cỡ hình 1280 / 960 / 800 ·
#   thời gian bật lại bộ nén. So với Android 12 (Codec2, giống MuMu). Chỉ đo — không phát hành, không đụng máy chủ thật nào.
#   Kết quả: bảng trong trang tóm tắt của lượt chạy (Summary).
# 27/11f · cbvideo: máy chủ hình RIÊNG cho Android 9 (.github/a9-check/A9Video.java → cbvideo.jar, dựng ngay trong job emu) — đọc hình bằng
#   ImageReader rồi nạp bộ nén bằng ByteBuffer (scrcpy trên Android 9 chỉ ~15 khung/giây vì bộ nén tự đọc ngược hình từ GPU trong luồng nén).
#   So scrcpy vs cbvideo; cbvideo ra hình + giải mã sạch trên Android 9 → job tự lưu windows/cbvideo.jar vào chính nhánh đang thử.
name: Check Android 9 stream

on:
  push:
    branches: ["appa9-*"]
    paths:
      - "windows/bluestream.py"
      - ".github/a9-check/**"
      - ".github/workflows/a9-check.yml"
  workflow_dispatch:

concurrency:
  group: a9-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic phát hình Android 9 (27/11e) — cỡ hình, khung I, ngưỡng bỏ khung, bật lại bộ nén, thông số
        run: python3 .github/a9-check/test_a9logic.py

  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # 27/11f: lưu cbvideo.jar (dựng từ A9Video.java ngay trong lượt chạy này) vào CHÍNH nhánh đang thử
    strategy:
      fail-fast: false
      matrix:
        api: [28, 31]     # 28 = Android 9 (như LDPlayer 9) · 31 = Android 12 (như MuMu)
    steps:
      - uses: actions/checkout@v4
      - name: Dựng cbvideo.jar (máy chủ hình riêng cho Android 9, từ .github/a9-check/A9Video.java)
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PLAT=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "android.jar: $PLAT · build-tools: $BT"
          rm -rf /tmp/cbv && mkdir -p /tmp/cbv/classes /tmp/cbv/dex
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options -nowarn -bootclasspath "$PLAT/android.jar" -d /tmp/cbv/classes .github/a9-check/A9Video.java
          "$BT/d8" --release --min-api 21 --lib "$PLAT/android.jar" --output /tmp/cbv/dex $(find /tmp/cbv/classes -name '*.class')
          (cd /tmp/cbv/dex && jar cfM "$GITHUB_WORKSPACE/cbvideo.jar" classes.dex)
          ls -l cbvideo.jar && md5sum cbvideo.jar
      - name: Dựng libcbenc.so (openh264 + JNI, Android x86_64 — bộ nén riêng của cbvideo, 27/11h)
        continue-on-error: true
        run: |
          set -e
          sudo apt-get install -y -qq nasm > /dev/null
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_SDK_ROOT/ndk-bundle}}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $NDK"
          git clone -q --depth 1 --branch v2.4.1 https://github.com/cisco/openh264 /tmp/oh
          OHLIB=""
          if (cd /tmp/oh && make -j4 OS=android NDKROOT="$NDK" TARGET=android-24 NDKLEVEL=24 ARCH=x86_64 libopenh264.a > /tmp/oh-make.log 2>&1); then
            OHLIB=/tmp/oh/libopenh264.a; echo "openh264: make OK"
          else
            tail -25 /tmp/oh-make.log
            echo "make lỗi → thử meson"
            pip install -q meson ninja
            printf "[binaries]\nc = '%s'\ncpp = '%s'\nar = '%s'\nstrip = '%s'\nnasm = 'nasm'\n[host_machine]\nsystem = 'android'\ncpu_family = 'x86_64'\ncpu = 'x86_64'\nendian = 'little'\n" \
              "$TC/x86_64-linux-android24-clang" "$TC/x86_64-linux-android24-clang++" "$TC/llvm-ar" "$TC/llvm-strip" > /tmp/cross.txt
            (cd /tmp/oh && meson setup /tmp/ohb --cross-file /tmp/cross.txt -Ddefault_library=static --buildtype=release && ninja -C /tmp/ohb)
            OHLIB=$(find /tmp/ohb -name 'libopenh264.a' | head -1)
          fi
          ls -l "$OHLIB"
          "$TC/x86_64-linux-android24-clang" -O3 -fPIC -c .github/a9-check/cbenc.c -I/tmp/oh/codec/api/wels -I/tmp/oh/codec/api/svc -o /tmp/cbenc.o
          "$TC/x86_64-linux-android24-clang++" -shared -o "$GITHUB_WORKSPACE/libcbenc.so" /tmp/cbenc.o "$OHLIB" -static-libstdc++ -lm -Wl,--build-id=none -s
          ls -l libcbenc.so && md5sum libcbenc.so
      - name: ffmpeg (giải mã thử dòng hình cbvideo)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1
      - name: Bật KVM cho máy ảo Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API ${{ matrix.api }} — đo phát hình scrcpy
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 4
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          script: python3 .github/a9-check/test_a9stream.py ${{ matrix.api }}
      - name: Giữ số đo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a9stream-${{ matrix.api }}
          path: |
            a9stream-*.json
            cbvideo.jar
            libcbenc.so
          if-no-files-found: ignore
      - name: Lưu windows/cbvideo.jar + libcbenc-x86_64.so vào nhánh (chỉ khi Android 9 ra hình + giải mã sạch)
        if: matrix.api == 28 && hashFiles('cbvideo-ok.txt') != ''
        run: |
          set -e
          mkdir -p windows
          # jar: chỉ thay khi classes.dex khác (zip có dấu giờ → md5 jar đổi mỗi lần dựng dù mã y hệt)
          dex_new=$(unzip -p cbvideo.jar classes.dex | md5sum | cut -d' ' -f1)
          dex_old=$( [ -f windows/cbvideo.jar ] && unzip -p windows/cbvideo.jar classes.dex | md5sum | cut -d' ' -f1 || echo none)
          if [ "$dex_new" != "$dex_old" ]; then cp cbvideo.jar windows/cbvideo.jar; echo "- cbvideo.jar MỚI (classes.dex đổi)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ -f libcbenc.so ] && ! cmp -s libcbenc.so windows/libcbenc-x86_64.so 2>/dev/null; then cp libcbenc.so windows/libcbenc-x86_64.so; echo "- libcbenc-x86_64.so MỚI" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          for f in windows/cbvideo.jar windows/libcbenc-x86_64.so; do
            [ -f "$f" ] && echo "- $f md5: \`$(md5sum $f | cut -d' ' -f1)\` · $(stat -c %s $f) byte" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows/cbvideo.jar windows/libcbenc-x86_64.so 2>/dev/null || git add windows/cbvideo.jar
          if git diff --cached --quiet; then echo "cbvideo.jar / libcbenc không đổi"; exit 0; fi
          git commit -q -m "cbvideo.jar + libcbenc-x86_64.so dựng từ .github/a9-check (CI, Android 9 giải mã sạch)" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_014zy4K1ke85zVx5zDEA3vr3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
