# KIỂM phần CachyOS của bộ cài máy PC (winpc/linux) — KHÔNG phát hành gì, không đụng máy thật nào:
#   1. grub:    dựng grubx64.efi (GRUB tự chứa, cấu hình nhúng = winpc/linux/grub-embed.cfg) → đẩy vào nhánh linux-bin (chỉ chứa file này)
#   2. boot:    (nhanh, ~10 phút) chế độ thử: GRUB → ISO trên NTFS → cb-install.sh chạy được, có mạng + khoá pacman → cb/linux-test.ok
#   3. install: máy ảo QEMU (UEFI / OVMF) + ổ ảo y như máy thật sau khi WinPE giao việc cài CachyOS: EFI "Windows" có GRUB, phân vùng NTFS
#               "CBRECOVERY" có cb/linux/cachyos.iso (ISO CachyOS THẬT) + grub.cfg + cb-install.sh + cb-post.sh + cb/job.json (mục "linux"),
#               EFI Linux + phân vùng Linux trống → GRUB mở thẳng ISO → cb-install.sh CÀI THẬT → khởi động lại vào CachyOS vừa cài
#               → dịch vụ thử (chỉ có ở chế độ ci) ghi cb/linux-firstboot.ok → kiểm 2 file kết quả.
#               Lần 2 có MÁY CHỦ GIẢ (winpc/tests/ci/fake_sb.py trên máy CI, 10.0.2.2:8099): agent CloudBlue bản Linux (cloudblue.service) phải tự chạy,
#               đăng ký bằng ĐÚNG vé của lệnh, báo os=cachyos rồi hỏi máy chủ được.
#               + ĐIỀU KHIỂN TỪ XA đầu-cuối (winpc/tests/ci/linux_remote_host.py): máy chủ phát hình THẬT (windows/bluestream.py --selftest) trên máy CI,
#               cbremote trong máy ảo tự nối tới, người xem mở → hình màn hình KDE thật tới, giải mã đủ; rê chuột → con trỏ trên KDE đổi chỗ.
name: Check winpc Linux (CachyOS)

on:
  push:
    branches: [main, "linux-*"]      # nhánh linux-…: thử trước khi gộp
    paths:
      - "winpc/linux/**"
      - "winpc/agent/pcagent.py"
      - "winpc/lib/**"
      - "winpc/tests/ci/fake_sb.py"
      - "winpc/tests/ci/linux_remote_host.py"
      - "winpc/agent/pcremote.py"
      - "windows/bluestream.py"
      - "windows/pcrelay.py"
      - ".github/workflows/linux-check.yml"
  workflow_dispatch:
    inputs:
      iso_url:
        description: "ISO CachyOS dùng để thử"
        required: false
        default: "https://cdn77.cachyos.org/ISO/desktop/260809/cachyos-desktop-linux-260809.iso"

permissions:
  contents: write          # chỉ để đẩy grubx64.efi vào nhánh linux-bin

concurrency:
  group: linux-check
  cancel-in-progress: true

jobs:
  grub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dựng grubx64.efi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq grub-efi-amd64-bin grub-common > /dev/null
          MODS=""
          for m in part_gpt part_msdos fat ntfs ntfscomp exfat iso9660 udf loopback linux normal configfile search search_fs_file search_fs_uuid \
                   search_label test echo probe sleep reboot halt efi_gop efi_uga all_video gfxterm font regexp cat ls minicmd gzio xzio; do
            if [ -f /usr/lib/grub/x86_64-efi/$m.mod ]; then MODS="$MODS $m"; else echo "(GRUB bản này không có $m - bỏ)"; fi
          done
          grub-mkstandalone -O x86_64-efi -o grubx64.efi --locales="" --fonts="" --themes="" --modules="$MODS" --install-modules="$MODS" \
            "boot/grub/grub.cfg=winpc/linux/grub-embed.cfg"
          ls -l grubx64.efi; md5sum grubx64.efi | tee grubx64.efi.md5
          grub-mkstandalone --version | tee grub-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grubx64
          path: |
            grubx64.efi
            grubx64.efi.md5
            grub-version.txt
      - name: Đẩy vào nhánh linux-bin
        run: |
          mkdir /tmp/lb && cp grubx64.efi grubx64.efi.md5 grub-version.txt /tmp/lb/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan linux-bin-tmp
          git rm -r -q --cached .
          rm -rf ./* .github 2>/dev/null || true
          cp /tmp/lb/* .
          mkdir -p blueroblox-site && echo '{"git":{"deploymentEnabled":false}}' > blueroblox-site/vercel.json
          git add grubx64.efi grubx64.efi.md5 grub-version.txt blueroblox-site/vercel.json
          git commit -q -m "grubx64.efi ($GITHUB_SHA)"
          git push -f origin HEAD:refs/heads/linux-bin

  boot:
    needs: grub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grubx64
          path: gb
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: Cài QEMU + OVMF + công cụ NTFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf ntfs-3g dosfstools gdisk > /dev/null
          ls /usr/share/OVMF/
      - name: Tải ISO CachyOS
        env:
          ISO_URL: ${{ github.event.inputs.iso_url || 'https://cdn77.cachyos.org/ISO/desktop/260809/cachyos-desktop-linux-260809.iso' }}
        run: |
          curl -fL --retry 5 --retry-delay 10 -o cachyos.iso "$ISO_URL"
          ls -l cachyos.iso; sha256sum cachyos.iso
      - name: Dựng ổ ảo (EFI + CBRECOVERY NTFS) như sau khi WinPE giao việc
        run: |
          truncate -s 10G disk.img
          sgdisk -o -n1:1M:+100M -t1:ef00 -c1:EFI -n2:0:0 -t2:0700 -c2:CBRECOVERY disk.img
          LOOP=$(sudo losetup -f --show -P disk.img); echo "LOOP=$LOOP" >> $GITHUB_ENV
          sudo mkfs.vfat -F32 -n EFI ${LOOP}p1 > /dev/null
          sudo mkntfs -f -q -L CBRECOVERY ${LOOP}p2
          sudo mkdir -p /mnt/esp /mnt/rec
          sudo mount ${LOOP}p1 /mnt/esp
          sudo mkdir -p /mnt/esp/EFI/BOOT && sudo cp gb/grubx64.efi /mnt/esp/EFI/BOOT/BOOTX64.EFI
          sudo umount /mnt/esp
          sudo mount -t ntfs-3g ${LOOP}p2 /mnt/rec
          sudo mkdir -p /mnt/rec/cb/linux /mnt/rec/cb/logs
          sudo cp cachyos.iso /mnt/rec/cb/linux/cachyos.iso
          sudo cp winpc/linux/grub.cfg winpc/linux/cb-install.sh winpc/linux/cb-post.sh /mnt/rec/cb/linux/
          echo '{"id": "ci", "os": "cachyos", "test": true}' | sudo tee /mnt/rec/cb/job.json
          printf 'set cbextra="console=ttyS0,115200 loglevel=4 systemd.show_status=1 systemd.log_target=console systemd.log_level=info"\n' | sudo tee /mnt/rec/cb/linux/job.cfg
          sudo umount /mnt/rec
          sudo losetup -d $LOOP
      - name: Khởi động máy ảo UEFI (tối đa 15 phút)
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          ACC="-machine q35"
          if [ -w /dev/kvm ]; then ACC="-machine q35,accel=kvm -cpu host"; else ACC="-machine q35 -cpu max"; fi
          set +e
          timeout 900 qemu-system-x86_64 $ACC -m 4096 -smp 2 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -drive file=disk.img,format=raw,if=none,id=d0 -device virtio-blk-pci,drive=d0 \
            -nic user,model=virtio-net-pci -display none -serial file:serial.log -no-reboot
          echo "qemu thoat ma $?"
          {
            echo '### Nhật ký cổng nối tiếp — dòng chính'
            echo '```'
            grep -a -n -E "cloudblue|Command from Kernel|kernel-command-line|Failed to|FAILED|Reached target (Basic|Multi|Graphical)|login:|Power-Off|Reached target Power|archiso|img_dev|systemd 2[0-9][0-9]" serial.log | sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' | cut -c1-200 | head -120
            echo '```'
          } >> $GITHUB_STEP_SUMMARY || true
          echo "== serial.log ($(wc -l < serial.log) dong) =="; cat serial.log || true
      - name: Kiểm kết quả trên phân vùng CBRECOVERY
        run: |
          LOOP=$(sudo losetup -f --show -P disk.img)
          sudo mount -t ntfs-3g -o ro ${LOOP}p2 /mnt/rec
          echo "== cb/linux-test.ok =="; sudo cat /mnt/rec/cb/linux-test.ok || true
          OK=0; sudo grep -q CB_TEST_OK /mnt/rec/cb/linux-test.ok 2>/dev/null && OK=1
          for k in net keyring unsquashfs sfs efibootmgr rw; do v=$(sudo grep -o "$k=[^ ]*" /mnt/rec/cb/linux-test.ok 2>/dev/null | head -1); echo "- $v" >> $GITHUB_STEP_SUMMARY; done
          sudo ls -la /mnt/rec/cb/ /mnt/rec/cb/logs/ 2>/dev/null || true
          { echo '### Trên phân vùng cứu hộ'; echo '```'; sudo cat /mnt/rec/cb/linux-started.txt 2>/dev/null || echo "(khong co cb/linux-started.txt -> cb-install.sh KHONG chay)";
            sudo cat /mnt/rec/cb/linux-test.ok 2>/dev/null; for f in /mnt/rec/cb/logs/linux-install-*.log; do [ -f "$f" ] && sudo tail -n 40 "$f"; done; echo '```'; } >> $GITHUB_STEP_SUMMARY || true
          sudo umount /mnt/rec; sudo losetup -d $LOOP
          if [ "$OK" = 1 ]; then echo "linux check: DAT (GRUB -> ISO CachyOS tren NTFS -> cb-install.sh)" >> $GITHUB_STEP_SUMMARY; else echo "linux check: CHUA DAT" >> $GITHUB_STEP_SUMMARY; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log
          path: serial.log

  install:
    needs: grub
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grubx64
          path: gb
      - name: Dọn chỗ trống trên máy CI + bật KVM
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup 2>/dev/null || true
          df -h / | tail -1; nproc; free -m | head -2
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: Cài QEMU + OVMF + công cụ NTFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf ntfs-3g dosfstools gdisk jq ffmpeg python3-cryptography > /dev/null
          ls /usr/share/OVMF/
      - name: Tải ISO CachyOS
        env:
          ISO_URL: ${{ github.event.inputs.iso_url || 'https://cdn77.cachyos.org/ISO/desktop/260809/cachyos-desktop-linux-260809.iso' }}
        run: |
          curl -fL --retry 5 --retry-delay 10 -o cachyos.iso "$ISO_URL"
          ls -l cachyos.iso; sha256sum cachyos.iso
      - name: Dựng ổ ảo như sau khi WinPE giao việc cài CachyOS (EFI Windows · CBRECOVERY · EFI Linux · Linux)
        run: |
          truncate -s 44G disk.img
          sgdisk -o -n1:1M:+100M -t1:ef00 -c1:EFI -n2:0:+5G -t2:0700 -c2:CBRECOVERY -n3:0:+1G -t3:ef00 -c3:CBLINUXEFI -n4:0:0 -t4:8300 disk.img
          sfdisk -J disk.img | tee parts.json
          LOOP=$(sudo losetup -f --show -P disk.img); echo "LOOP=$LOOP" >> $GITHUB_ENV
          sudo mkfs.vfat -F32 -n EFI ${LOOP}p1 > /dev/null
          sudo mkntfs -f -q -L CBRECOVERY ${LOOP}p2
          sudo mkfs.vfat -F32 -n CBLINUXEFI ${LOOP}p3 > /dev/null
          sudo mkdir -p /mnt/esp /mnt/rec
          sudo mount ${LOOP}p1 /mnt/esp
          sudo mkdir -p /mnt/esp/EFI/BOOT /mnt/esp/EFI/cblinux && sudo cp gb/grubx64.efi /mnt/esp/EFI/BOOT/BOOTX64.EFI && sudo cp gb/grubx64.efi /mnt/esp/EFI/cblinux/grubx64.efi
          sudo umount /mnt/esp
          REC_UUID=$(sudo blkid -s UUID -o value ${LOOP}p2); echo "REC_UUID=$REC_UUID"
          sudo mount -t ntfs-3g ${LOOP}p2 /mnt/rec
          sudo mkdir -p /mnt/rec/cb/linux /mnt/rec/cb/logs
          sudo cp cachyos.iso /mnt/rec/cb/linux/cachyos.iso && rm -f cachyos.iso
          sudo cp winpc/linux/grub.cfg winpc/linux/cb-install.sh winpc/linux/cb-post.sh winpc/linux/cbagent.py winpc/linux/cbremote.py winpc/linux/cbcap.py /mnt/rec/cb/linux/
          sudo mkdir -p /mnt/rec/cb/agent /mnt/rec/cb/lib
          sudo cp winpc/agent/pcagent.py winpc/agent/pcremote.py /mnt/rec/cb/agent/ && sudo cp winpc/lib/cbcore.py winpc/lib/cbrec.py winpc/lib/cbsys.py /mnt/rec/cb/lib/
          jq -n '{ver: "ci", default: "22h2", user: "PC", sb_url: "http://10.0.2.2:8099", sb_key: "ci-khoa-cong-khai",
                  images: [{id: "22h2", file: "cb\\images\\22h2.wim", index: 1}, {id: "cachyos", kind: "linux", file: "cb\\linux\\cachyos.iso"}]}' | sudo tee /mnt/rec/cb/cb.json
          SS=$(jq '.partitiontable.sectorsize // 512' parts.json)
          E_OFF=$(jq ".partitiontable.partitions[2].start * $SS" parts.json); E_SZ=$(jq ".partitiontable.partitions[2].size * $SS" parts.json)
          R_OFF=$(jq ".partitiontable.partitions[3].start * $SS" parts.json); R_SZ=$(jq ".partitiontable.partitions[3].size * $SS" parts.json)
          jq -n --argjson eo "$E_OFF" --argjson es "$E_SZ" --argjson ro "$R_OFF" --argjson rs "$R_SZ" \
            '{id: "ci", os: "cachyos", wipe: "all", name: "CB-CI01", ci: true, state: "running", attempts: 1, ticket: "ve-thu-ci", hw: "ci",
              linux: {esp: {offset: $eo, size: $es}, root: {offset: $ro, size: $rs}, user: "pc", pass: "ci-pass", admin: true, autologin: true,
                      desktop: "kde", tz: "Asia/Ho_Chi_Minh", locale: "en_US", keymap: "us"}}' | sudo tee /mnt/rec/cb/job.json
          printf 'set cbdev=UUID=%s\nset cbextra="console=ttyS0,115200 loglevel=4 systemd.show_status=1"\n' "$REC_UUID" | sudo tee /mnt/rec/cb/linux/job.cfg
          sudo umount /mnt/rec
          sudo losetup -d $LOOP
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          df -h / | tail -1
      - name: "Lần 1: GRUB → ISO CachyOS → cb-install.sh cài thật (tối đa 150 phút)"
        run: |
          MEM=$(( $(free -m | awk '/^Mem:/{print $2}') - 1800 )); [ $MEM -gt 8192 ] && MEM=8192; [ $MEM -lt 3072 ] && MEM=3072
          CPU=$(nproc); echo "may ao: ${MEM} MB RAM, $CPU CPU"
          if [ -w /dev/kvm ]; then ACC="-machine q35,accel=kvm -cpu host"; else ACC="-machine q35 -cpu max"; fi
          set +e
          timeout 9000 qemu-system-x86_64 $ACC -m $MEM -smp $CPU \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -drive file=disk.img,format=raw,if=none,id=d0,cache=unsafe -device virtio-blk-pci,drive=d0 \
            -nic user,model=virtio-net-pci -display none -serial file:serial1.log -no-reboot
          echo "qemu thoat ma $?"
          {
            echo '### Lần 1 (cài) — dòng chính của nhật ký cổng nối tiếp'
            echo '```'
            grep -a -E "\[cloudblue|Failed to|FAILED|Power-Off|Reached target (Basic|Multi)|reboot" serial1.log | sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' | cut -c1-220 | head -150
            echo '```'
          } >> $GITHUB_STEP_SUMMARY || true
          echo "== serial1.log ($(wc -l < serial1.log) dong) =="; tail -n 400 serial1.log || true
      - name: Kiểm kết quả cài
        run: |
          LOOP=$(sudo losetup -f --show -P disk.img)
          sudo mount -t ntfs-3g -o ro ${LOOP}p2 /mnt/rec
          sudo ls -la /mnt/rec/cb/ /mnt/rec/cb/linux /mnt/rec/cb/logs 2>/dev/null || true
          { echo '### Sau lần 1'; echo '```'; for f in linux-started.txt job-result.json job.done.json job.json linux/installed.json; do echo "--- cb/$f"; sudo cat /mnt/rec/cb/$f 2>/dev/null | sed -E 's/"pass": *"[^"]*"/"pass": "***"/'; echo; done
            for f in /mnt/rec/cb/logs/linux-install-*.log; do [ -f "$f" ] && sudo tail -n 60 "$f"; done; echo '```'; } >> $GITHUB_STEP_SUMMARY || true
          sudo grep -q '"ok": true' /mnt/rec/cb/job-result.json 2>/dev/null && echo "CAI_OK=1" >> $GITHUB_ENV || echo "CAI_OK=0" >> $GITHUB_ENV
          sudo umount /mnt/rec
          sudo mkdir -p /mnt/lr && sudo mount -o ro,subvol=/@ ${LOOP}p4 /mnt/lr 2>/dev/null && { sudo ls /mnt/lr/boot /mnt/lr/home 2>/dev/null; sudo cat /mnt/lr/etc/fstab; sudo umount /mnt/lr; } || true
          sudo mkdir -p /mnt/le && sudo mount -o ro ${LOOP}p3 /mnt/le 2>/dev/null && { sudo find /mnt/le -maxdepth 3 | head -40; sudo cat /mnt/le/loader/loader.conf /mnt/le/loader/entries/*.conf; sudo umount /mnt/le; } || true
          sudo losetup -d $LOOP
      - name: "Lần 2: khởi động CachyOS vừa cài (tối đa 15 phút)"
        if: env.CAI_OK == '1'
        run: |
          MEM=$(( $(free -m | awk '/^Mem:/{print $2}') - 1800 )); [ $MEM -gt 8192 ] && MEM=8192; [ $MEM -lt 3072 ] && MEM=3072
          if [ -w /dev/kvm ]; then ACC="-machine q35,accel=kvm -cpu host"; else ACC="-machine q35 -cpu max"; fi
          python3 -u winpc/tests/ci/linux_remote_host.py --sb 8099 --relay 8189 --out "$PWD/remote.json" --log "$PWD/rpc.log" --wait 840 > fake_sb.out 2>&1 &
          SBPID=$!; sleep 3; cat fake_sb.out
          set +e
          timeout 900 qemu-system-x86_64 $ACC -m $MEM -smp $(nproc) \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -drive file=disk.img,format=raw,if=none,id=d0,cache=unsafe -device virtio-blk-pci,drive=d0 \
            -nic user,model=virtio-net-pci -display none -serial file:serial2.log -no-reboot
          echo "qemu thoat ma $?"
          kill $SBPID 2>/dev/null; pkill -f "bluestream.py --selftest" 2>/dev/null; tail -12 fake_sb.out 2>/dev/null
          {
            echo '### Lần 2 (khởi động CachyOS) — dòng chính'
            echo '```'
            grep -a -E "systemd-boot|Linux Boot Manager|Welcome to|Reached target|Failed to|FAILED|login:|Power-Off|cloudblue|CloudBlue" serial2.log | sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' | cut -c1-200 | head -120
            echo '```'
          } >> $GITHUB_STEP_SUMMARY || true
          echo "== serial2.log ($(wc -l < serial2.log) dong) =="; tail -n 300 serial2.log || true
      - name: Kiểm máy CachyOS đã lên
        run: |
          LOOP=$(sudo losetup -f --show -P disk.img)
          sudo mount -t ntfs-3g -o ro ${LOOP}p2 /mnt/rec
          { echo '### cb/linux-firstboot.ok'; echo '```'; sudo cat /mnt/rec/cb/linux-firstboot.ok 2>/dev/null || echo "(khong co - CachyOS chua khoi dong toi dich vu thu)"; echo '```'; } >> $GITHUB_STEP_SUMMARY
          OK=0; sudo grep -q CB_FIRSTBOOT_OK /mnt/rec/cb/linux-firstboot.ok 2>/dev/null && OK=1
          AG=0; sudo grep -q "^agent=active opt=700 seed_ticket=0 identity=600" /mnt/rec/cb/linux-firstboot.ok 2>/dev/null && AG=1
          VIRT=0; sudo grep -A4 "^--- cbcap probe (man hinh ao" /mnt/rec/cb/linux-firstboot.ok 2>/dev/null | grep -Eq "^cbcap probe: backend=kwin virtual=1 rtp=([2-9][0-9]|[0-9]{3,}) " && VIRT=1   # 22.11h: máy không cắm màn hình
          APP=0; sudo grep -Eq "^nguoi xem CI da mo qua menu: konsole=[1-9][0-9]* firefox=[1-9]" /mnt/rec/cb/linux-firstboot.ok 2>/dev/null && APP=1   # 23.11a: khách mở được terminal + trình duyệt qua menu KDE
          mkdir -p linux-shots; sudo cat /mnt/rec/cb/linux-firstboot.ok > linux-shots/firstboot.txt 2>/dev/null || true
          sudo umount /mnt/rec; sudo losetup -d $LOOP
          RPC=0
          echo '### Agent CloudBlue (Linux) gọi máy chủ giả' >> $GITHUB_STEP_SUMMARY
          python3 -I winpc/tests/ci/fake_sb.py --check rpc.log ve-thu-ci >> $GITHUB_STEP_SUMMARY && RPC=1
          RMT=0
          { echo '### Điều khiển từ xa đầu-cuối (người xem trên máy CI ⇄ trạm thật ⇄ CachyOS)'; echo '```'; cat remote.json 2>/dev/null || echo "(khong co remote.json)"; echo '```'; } >> $GITHUB_STEP_SUMMARY
          python3 -c "import json,sys; j=json.load(open('remote.json')); sys.exit(0 if j.get('ok') and j.get('cursor_moved') and j.get('click_ok') and (j.get('stats') or {}).get('cap') == 'kwin' else 1)" 2>/dev/null && RMT=1
          if [ "$CAI_OK" = 1 ] && [ "$OK" = 1 ] && [ "$AG" = 1 ] && [ "$RPC" = 1 ] && [ "$RMT" = 1 ] && [ "$VIRT" = 1 ] && [ "$APP" = 1 ]; then echo "linux check: DAT (WinPE giao viec -> GRUB -> ISO -> cb-install.sh cai CachyOS -> khoi dong vao CachyOS -> agent tu dang ky bang ve -> dieu khien tu xa qua KWin truc tiep (khong hop hoi): hinh KDE that toi nguoi xem, re + bam chuot duoc; may khong cam man hinh -> man hinh ao; nguoi xem mo Konsole + Firefox qua menu KDE)" >> $GITHUB_STEP_SUMMARY
          else echo "linux check: CHUA DAT (cai=$CAI_OK, khoi dong=$OK, dich vu agent=$AG, agent goi may chu=$RPC, dieu khien tu xa=$RMT, man hinh ao=$VIRT, mo app qua menu=$APP)" >> $GITHUB_STEP_SUMMARY; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-logs
          path: |
            serial1.log
            serial2.log
            parts.json
            rpc.log
            remote.json
            fake_sb.out
      - name: Ảnh khách mở app qua menu (nhánh linux-shots)
        if: always()
        run: |
          ls linux-shots/* >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/ls && cp linux-shots/*.png linux-shots/*.txt /tmp/ls/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan linux-shots-tmp
          git rm -r -q --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/lsrepo/shots /tmp/lsrepo/blueroblox-site && cp /tmp/ls/* /tmp/lsrepo/shots/
          echo '{"git":{"deploymentEnabled":false}}' > /tmp/lsrepo/blueroblox-site/vercel.json
          git --work-tree=/tmp/lsrepo add -A shots blueroblox-site
          git --work-tree=/tmp/lsrepo commit -q -m "Anh CachyOS mo app ($GITHUB_SHA)"
          git push -q -f origin HEAD:refs/heads/linux-shots
