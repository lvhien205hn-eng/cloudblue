# 24/11 · ISO MÁY MẪU VPS ảo hoá (proxmox/tao-iso-may-mau.ps1 + proxmox/vm/): thử trên nhánh appvm-* TRƯỚC khi gộp vào main.
#   1. sim  (Ubuntu): bộ thử Python (vm_build.py, cbhost.py) + soát tĩnh .ps1 / .cmd của proxmox/.
#   2. win  (Windows Server 2022 thật, PowerShell 5.1, quyền Admin): proxmox/tests/ci/vm_iso_check.ps1 — tạo ISO máy mẫu từ "ISO Windows" giả
#           + ISO virtio-win 0.1.271 thật, mở ISO ra kiểm, rồi chạy maymau.ps1 bước 1 + 2 thật trên máy CI (chế độ -Thu, không gọi web thật).
#   Kết quả → nhánh vm-shots (shots/*-ketqua.txt, kèm vercel.json tắt deploy). Không đụng máy thật nào, không đưa gì lên web.
name: Check ISO may mau VPS ao hoa

on:
  push:
    branches: ["appvm-*"]
    paths:
      - "proxmox/**"
      - ".github/workflows/vm-iso-check.yml"
  workflow_dispatch:

permissions:
  contents: write          # chỉ để đẩy kết quả vào nhánh vm-shots

concurrency:
  group: vm-iso-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bộ thử Python + soát tĩnh
        run: |
          mkdir -p kq
          {
            for t in proxmox/tests/test_vm_build.py proxmox/tests/test_cbhost.py; do
              if python3 "$t" > /tmp/out.txt 2>&1; then echo "OK  $t: $(tail -1 /tmp/out.txt)"; else echo "XX  $t: $(grep -E '✗|Error|error' /tmp/out.txt | head -8 | tr '\n' '|') $(tail -1 /tmp/out.txt)"; fi
            done
            if python3 winpc/tests/lint_ps1.py proxmox > /tmp/out.txt 2>&1; then echo "OK  soát .ps1/.cmd của proxmox/"; else echo "XX  soát .ps1/.cmd: $(grep '✗' /tmp/out.txt | head -8 | tr '\n' '|')"; fi
          } | tee kq/vm-sim-ketqua.txt
          ! grep -q '^XX' kq/vm-sim-ketqua.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-kq-sim
          path: kq
          if-no-files-found: ignore

  win:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # giữ nguyên từng byte như trên GitHub (không đổi xuống dòng) để mã kiểm manifest khớp
      - name: Keep line endings
        shell: cmd
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Tạo ISO máy mẫu + chạy maymau.ps1 (vm_iso_check.ps1)
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\kq"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File proxmox\tests\ci\vm_iso_check.ps1 -KetQua "%RUNNER_TEMP%\kq\vm-iso-ketqua.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-kq-win
          path: ${{ runner.temp }}/kq
          if-no-files-found: ignore

  shots:
    needs: [sim, win]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-kq-*
          path: shots
          merge-multiple: true
      - name: Lưu kết quả vào nhánh vm-shots
        run: |
          ls -la shots || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vm-shots-tmp
          git rm -r -q --cached .
          mkdir -p blueroblox-site
          echo '{"git":{"deploymentEnabled":false}}' > blueroblox-site/vercel.json
          git add shots blueroblox-site/vercel.json
          git commit -q -m "Ket qua thu ISO may mau VPS ao hoa ($GITHUB_SHA)"
          git push -f origin HEAD:refs/heads/vm-shots
