# Build Android app BlueRoblox Cloud -> blueroblox-site/download/blueroblox-cloud.apk (ban web)
#   + ban CH Play vn.cloudblue.app -> file .aab o GitHub Release "chplay-latest" (va tu day len CH Play neu co secret PLAY_SERVICE_ACCOUNT_JSON)
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

# Repo mới (chuyển tài khoản GitHub 09/11/2026) đếm lại số lần build từ 1 → cộng VER_OFFSET để số bản app
# luôn LỚN hơn bản cũ (Android 1.46, PC 1.15) — nếu không app cũ sẽ không thấy bản mới và Android không cài đè được.
env:
  VER_OFFSET: "100"
  # Dòng hướng dẫn hiện trong hộp "Có bản cập nhật mới" của app CŨ (cài trước 13:20 09/11/2026, ký bằng khoá cũ → Android không
  # cho cập nhật đè, báo INSTALL_FAILED_UPDATE_INCOMPATIBLE). App cũ chỉ đọc "version" của app.json; web + app từ 1.103 đọc "ver".
  # Khi khách đã cài lại hết: để trống ("") rồi build lại. Đã có secret khoá cũ (xoay khoá thành công) thì tự bỏ dòng này.
  OLD_KEY_HINT: "⚠️ Cập nhật báo lỗi INSTALL_FAILED? Gỡ app này rồi cài bản mới tải tại cloudblue.vn/download/blueroblox-cloud.apk"

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Máy GitHub đã có sẵn Android SDK → chỉ cần chấp nhận giấy phép + cài bản Android 16 (API 36)
      - name: Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Version
        run: echo "APP_VERSION_CODE=$(( ${{ github.run_number }} + VER_OFFSET ))" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          OLD_B64: ${{ secrets.ANDROID_OLD_KEYSTORE_B64 }}
        run: |
          # KHÔNG phát hành APK ký bằng khoá tạm: khách đang dùng app sẽ không cập nhật đè được
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_B64 (Settings > Secrets and variables > Actions) - build stopped"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
          # Khoá CŨ (đã ký app 1.4x, trước 13:20 09/11/2026) — có thì ký thêm bằng khoá cũ + "xoay khoá" để app cũ cập nhật thẳng được.
          # Bỏ mọi khoảng trắng / xuống dòng (dán từ Notepad / điện thoại hay thừa \r\n). Hỏng → chỉ bỏ qua xoay khoá, KHÔNG làm hỏng bản build.
          if [ -z "$OLD_B64" ]; then
            echo "::warning::Chua co secret ANDROID_OLD_KEYSTORE_B64 - APK chi ky khoa moi, app cu (khoa cu) phai go roi cai lai"
          elif printf '%s' "$OLD_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/old.jks" 2>/dev/null && [ -s "$RUNNER_TEMP/old.jks" ]; then
            echo "OLD_KEYSTORE_FILE=$RUNNER_TEMP/old.jks" >> "$GITHUB_ENV"; echo "Khoa cu: da doc tu secret ANDROID_OLD_KEYSTORE_B64"
          else
            echo "::warning::Secret ANDROID_OLD_KEYSTORE_B64 khong giai ma duoc (dan thieu / sai noi dung) - bo qua xoay khoa"
          fi

      # Bản web (shop.blueroblox.app, file .apk cho cloudblue.vn) — bản chính, lỗi là dừng
      - name: Build APK (web)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android-app assembleWebRelease --no-daemon --stacktrace

      # Bản CH Play (vn.cloudblue.app, file .aab) — lỗi KHÔNG làm hỏng bản web (continue-on-error)
      - name: Build CH Play bundle (.aab)
        id: play
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android-app bundlePlayRelease --no-daemon --stacktrace

      # XOAY KHOÁ (APK Signature Scheme v3, Android 9+): v1/v2 ký bằng khoá CŨ, v3 ký bằng khoá MỚI + "lịch sử khoá" (cũ → mới).
      #   • App cũ ký khoá cũ (1.4x) → cập nhật được trên MỌI Android (không phải gỡ cài lại)
      #   • App 1.101 / 1.102 ký khoá mới → cập nhật được trên Android 9 trở lên
      # Lỗi bất kỳ bước nào / kiểm chữ ký không đúng → GIỮ bản ký khoá mới như cũ (build vẫn xong, app.json có dòng hướng dẫn gỡ / cài lại).
      - name: Rotate signing key (old -> new)
        if: env.OLD_KEYSTORE_FILE != ''
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OLD_PASSWORD: ${{ secrets.ANDROID_OLD_KEYSTORE_PASSWORD }}
        run: |
          set -e
          # mật khẩu dán vào secret hay thừa xuống dòng (\r\n) → bỏ, không thì apksigner báo sai mật khẩu
          OLD_PASSWORD="$(printf '%s' "$OLD_PASSWORD" | tr -d '\r\n')"; export OLD_PASSWORD
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"; export KEYSTORE_PASSWORD
          if [ -z "$OLD_PASSWORD" ]; then echo "::warning::Chua co secret ANDROID_OLD_KEYSTORE_PASSWORD - bo qua xoay khoa"; exit 1; fi
          # kiểm khoá cũ ĐÚNG là khoá đã ký app 1.4x (chứng chỉ 1A:48:23:02…) trước khi ký
          FP=$(keytool -list -v -keystore "$OLD_KEYSTORE_FILE" -storepass "$OLD_PASSWORD" 2>&1 | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f' || true)
          if [ -z "$FP" ]; then echo "::warning::Khong mo duoc khoa cu - kiem lai secret ANDROID_OLD_KEYSTORE_PASSWORD (dung mat khau trong file ANDROID_OLD_KEYSTORE_PASSWORD.txt)"; exit 1; fi
          if [ "$FP" != "1a48230206ea270211c562613489cd788daef26aff6115ecf15c6b0451cc804a" ]; then echo "::warning::File khoa cu KHONG dung khoa da ky app 1.4x (chung chi $FP)"; exit 1; fi
          echo "Khoa cu dung: chung chi 1A:48:23:02... (app 1.4x)"
          AS="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK=android-app/app/build/outputs/apk/web/release/app-web-release.apk
          "$AS" rotate --out "$RUNNER_TEMP/lineage" \
            --old-signer --ks "$OLD_KEYSTORE_FILE" --ks-key-alias blueroblox --ks-pass env:OLD_PASSWORD --key-pass env:OLD_PASSWORD \
            --new-signer --ks "$KEYSTORE_FILE" --ks-key-alias blueroblox --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD
          "$AS" sign --ks "$OLD_KEYSTORE_FILE" --ks-key-alias blueroblox --ks-pass env:OLD_PASSWORD --key-pass env:OLD_PASSWORD \
            --next-signer --ks "$KEYSTORE_FILE" --ks-key-alias blueroblox --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --lineage "$RUNNER_TEMP/lineage" --rotation-min-sdk-version 28 --out "$RUNNER_TEMP/rot.apk" "$APK"
          "$AS" verify --min-sdk-version 24 -v "$RUNNER_TEMP/rot.apk"
          python3 - "$RUNNER_TEMP/rot.apk" <<'PY'
          import hashlib, struct, sys
          OLD = "1a48230206ea270211c562613489cd788daef26aff6115ecf15c6b0451cc804a"   # chứng chỉ khoá cũ (app 1.4x)
          NEW = "c1c3f3bf64d4672091d43da7edbecfbf260b6d886d8438e7d247284ee816fc24"   # chứng chỉ khoá mới (app 1.101+)
          d = open(sys.argv[1], "rb").read()
          u32 = lambda o: struct.unpack_from("<I", d, o)[0]
          u64 = lambda o: struct.unpack_from("<Q", d, o)[0]
          def lp(b, o):
              n = struct.unpack_from("<I", b, o)[0]
              return b[o + 4:o + 4 + n], o + 4 + n
          eocd = d.rfind(b"PK\x05\x06"); cd = u32(eocd + 16)
          assert d[cd - 16:cd] == b"APK Sig Block 42", "APK chua co khoi chu ky"
          o = cd - u64(cd - 24); got = {}
          while o < cd - 24:
              ln = u64(o); pid = u32(o + 8); val = d[o + 12:o + 8 + ln]; o += 8 + ln
              if pid in (0x7109871A, 0xF05368C0, 0x1B93AD61):
                  signers, _ = lp(val, 0); signer, q = lp(signers, 0); sd, _ = lp(signer, 0)
                  _, p = lp(sd, 0); certs, p = lp(sd, p); c0, _ = lp(certs, 0)
                  got[hex(pid)] = hashlib.sha256(c0).hexdigest(); got[hex(pid) + "_n"] = 1
                  while q < len(signers): _, q = lp(signers, q); got[hex(pid) + "_n"] += 1
          print("chung chi:", got)
          assert got.get("0x7109871a") == OLD and got.get("0x7109871a_n") == 1, "v2 phai la DUY NHAT khoa CU"
          assert got.get("0xf05368c0") == NEW, "v3 phai la khoa MOI"
          print("XOAY KHOA OK: app cu (khoa cu) + app 1.101+ (khoa moi) deu cap nhat duoc")
          print("::notice::XOAY KHOA OK - app cu (khoa cu) va app 1.101+ (khoa moi) deu cap nhat thang duoc")
          PY
          cp "$RUNNER_TEMP/rot.apk" "$APK"
          echo "ROTATED=1" >> "$GITHUB_ENV"

      - name: Copy APK to website
        run: |
          mkdir -p blueroblox-site/download
          cp android-app/app/build/outputs/apk/web/release/app-web-release.apk blueroblox-site/download/blueroblox-cloud.apk
          SIZE=$(stat -c %s blueroblox-site/download/blueroblox-cloud.apk)
          # "ver" = số bản gọn · "version" = số bản + OLD_KEY_HINT (cho app cũ; đã xoay khoá thì không cần) — ghi bằng python cho đúng JSON
          python3 -c 'import json, os, sys, time; v = "1." + os.environ["APP_VERSION_CODE"]; h = "" if os.environ.get("ROTATED") == "1" else os.environ.get("OLD_KEY_HINT", "").strip(); json.dump({"version": v + (". " + h if h else ""), "ver": v, "code": int(os.environ["APP_VERSION_CODE"]), "size": int(sys.argv[1]), "date": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}, open("blueroblox-site/download/app.json", "w", encoding="utf-8"), ensure_ascii=False)' "$SIZE"
          cat blueroblox-site/download/app.json

      - name: Key rotation result
        run: |
          if [ "$ROTATED" = "1" ]; then echo "::notice::APK 1.$APP_VERSION_CODE da XOAY KHOA (v2 khoa cu + v3 khoa moi)"
          else echo "::warning::APK 1.$APP_VERSION_CODE CHUA xoay khoa - chi ky khoa moi. Xem buoc 'Signing key' / 'Rotate signing key' de biet ly do."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: blueroblox-cloud-apk
          path: blueroblox-site/download/blueroblox-cloud.apk

      - uses: actions/upload-artifact@v4
        if: steps.play.outcome == 'success'
        with:
          name: cloudblue-chplay-aab
          path: android-app/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: warn

      # File .aab cho CH Play → GitHub Release "chplay-latest" (link cố định để tải về rồi upload vào Play Console):
      #   https://github.com/<repo>/releases/download/chplay-latest/cloudblue-chplay.aab
      - name: CH Play bundle -> GitHub Release
        if: steps.play.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$RUNNER_TEMP/cloudblue-chplay.aab"
          cp android-app/app/build/outputs/bundle/playRelease/app-play-release.aab "$OUT"
          NOTE="CloudBlue cho CH Play (vn.cloudblue.app) - ban 1.$APP_VERSION_CODE. Tai file cloudblue-chplay.aab roi upload vao Play Console (khong dua len web)."
          gh release view chplay-latest >/dev/null 2>&1 || gh release create chplay-latest --title "CloudBlue CH Play (.aab)" --notes "$NOTE"
          gh release upload chplay-latest "$OUT" --clobber
          gh release edit chplay-latest --notes "$NOTE"
          echo "::notice::CH Play 1.$APP_VERSION_CODE: https://github.com/${{ github.repository }}/releases/download/chplay-latest/cloudblue-chplay.aab"

      # TỰ ĐẨY LÊN CH PLAY (tuỳ chọn) — chỉ chạy khi có secret PLAY_SERVICE_ACCOUNT_JSON (tài khoản dịch vụ Google Cloud
      # được cấp quyền "Release" trong Play Console → API access). Lần đầu tiên vẫn phải upload tay trong Play Console.
      # Track mặc định "alpha" (Thử nghiệm kín); đổi bằng biến kho PLAY_TRACK (internal / alpha / beta / production).
      - name: Upload to Google Play (auto)
        if: steps.play.outcome == 'success'
        continue-on-error: true
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_STATUS: ${{ vars.PLAY_STATUS }}
          AAB: android-app/app/build/outputs/bundle/playRelease/app-play-release.aab
        run: |
          if [ -z "$PLAY_SA" ]; then
            echo "::notice::Chua bat tu day len CH Play (chua co secret PLAY_SERVICE_ACCOUNT_JSON) - tai file .aab o Release chplay-latest roi upload tay vao Play Console"
            exit 0
          fi
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          PKG = "vn.cloudblue.app"
          track = (os.environ.get("PLAY_TRACK") or "alpha").strip()
          status = (os.environ.get("PLAY_STATUS") or "completed").strip()
          try:
              info = json.loads(os.environ["PLAY_SA"])
          except Exception:
              print("::warning::Secret PLAY_SERVICE_ACCOUNT_JSON khong phai JSON hop le (dan thieu?) - bo qua"); sys.exit(0)
          s = AuthorizedSession(service_account.Credentials.from_service_account_info(info, scopes=["https://www.googleapis.com/auth/androidpublisher"]))
          API = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/" + PKG + "/edits"
          UP = "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/" + PKG + "/edits"
          def ok(r, what):
              if r.status_code >= 300:
                  msg = r.text[:600].replace("\n", " ")
                  hint = ""
                  if "draft app" in msg: hint = " (app chua phat hanh lan nao: dat bien PLAY_STATUS=draft, roi vao Play Console bam phat hanh)"
                  elif r.status_code in (401, 403): hint = " (tai khoan dich vu chua duoc moi / chua co quyen Release trong Play Console)"
                  elif "versionCode" in msg: hint = " (so ban da co tren CH Play - bo qua)"
                  print("::warning::CH Play loi o buoc " + what + ": HTTP " + str(r.status_code) + " " + msg + hint); sys.exit(0)
              return r.json() if r.text else {}
          edit = ok(s.post(API, timeout=60), "tao edit")["id"]
          with open(os.environ["AAB"], "rb") as f:
              b = ok(s.post(UP + "/" + edit + "/bundles?uploadType=media", data=f, headers={"Content-Type": "application/octet-stream"}, timeout=900), "tai .aab")
          vc = b["versionCode"]
          ok(s.put(API + "/" + edit + "/tracks/" + track, json={"track": track, "releases": [{"versionCodes": [str(vc)], "status": status}]}, timeout=60), "track " + track)
          ok(s.post(API + "/" + edit + ":commit", timeout=60), "commit")
          print("::notice::Da day ban 1." + str(vc) + " len CH Play (track " + track + ", " + status + ") - Google duyet xong la khach nhan cap nhat")
          PY

      - name: Save APK to repo (Vercel publishes it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueroblox-site/download
          git commit -m "App Android v1.$APP_VERSION_CODE" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
