# Build Android app BlueRoblox Cloud -> blueroblox-site/download/blueroblox-cloud.apk
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

# Repo mới (chuyển tài khoản GitHub 09/11/2026) đếm lại số lần build từ 1 → cộng VER_OFFSET để số bản app
# luôn LỚN hơn bản cũ (Android 1.46, PC 1.15) — nếu không app cũ sẽ không thấy bản mới và Android không cài đè được.
env:
  VER_OFFSET: "100"
  # Dòng hướng dẫn hiện trong hộp "Có bản cập nhật mới" của app CŨ (cài trước 13:20 09/11/2026, ký bằng khoá cũ → Android không
  # cho cập nhật đè, báo INSTALL_FAILED_UPDATE_INCOMPATIBLE). App cũ chỉ đọc "version" của app.json; web + app từ 1.103 đọc "ver".
  # Khi khách đã cài lại hết: để trống ("") rồi build lại.
  OLD_KEY_HINT: "⚠️ Cập nhật báo lỗi INSTALL_FAILED? Gỡ app này rồi cài bản mới tải tại cloudblue.vn/download/blueroblox-cloud.apk"

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Máy GitHub đã có sẵn Android SDK → chỉ cần chấp nhận giấy phép + cài bản Android 16 (API 36)
      - name: Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/platforms"

      - name: Version
        run: echo "APP_VERSION_CODE=$(( ${{ github.run_number }} + VER_OFFSET ))" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # KHÔNG phát hành APK ký bằng khoá tạm: khách đang dùng app sẽ không cập nhật đè được
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_B64 (Settings > Secrets and variables > Actions) - build stopped"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android-app assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Copy APK to website
        run: |
          mkdir -p blueroblox-site/download
          cp android-app/app/build/outputs/apk/release/app-release.apk blueroblox-site/download/blueroblox-cloud.apk
          SIZE=$(stat -c %s blueroblox-site/download/blueroblox-cloud.apk)
          # "ver" = số bản gọn · "version" = số bản + OLD_KEY_HINT (cho app cũ) — ghi bằng python để chữ có dấu / ký tự đặc biệt luôn đúng JSON
          python3 -c 'import json, os, sys, time; v = "1." + os.environ["APP_VERSION_CODE"]; h = os.environ.get("OLD_KEY_HINT", "").strip(); json.dump({"version": v + (". " + h if h else ""), "ver": v, "code": int(os.environ["APP_VERSION_CODE"]), "size": int(sys.argv[1]), "date": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}, open("blueroblox-site/download/app.json", "w", encoding="utf-8"), ensure_ascii=False)' "$SIZE"
          cat blueroblox-site/download/app.json

      - uses: actions/upload-artifact@v4
        with:
          name: blueroblox-cloud-apk
          path: blueroblox-site/download/blueroblox-cloud.apk

      - uses: actions/upload-artifact@v4
        with:
          name: blueroblox-cloud-aab-chplay
          path: android-app/app/build/outputs/bundle/release/app-release.aab

      - name: Save APK to repo (Vercel publishes it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blueroblox-site/download
          git commit -m "App Android v1.$APP_VERSION_CODE" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
