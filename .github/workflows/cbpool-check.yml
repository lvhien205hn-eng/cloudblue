# Thử kho proxy nhiều IP (cbpool) + cbhost tải / chạy cbpool + cbproxy đọc tên miền.
#   - dựng cbpool đúng cách ghim md5 (CGO tắt, -trimpath, -buildid=) → phải trùng file proxmox/cbpool-x86_64 và POOL_FILE trong proxmox/cbhost.py
#   - bộ thử Go trong không gian mạng riêng (CÓ IPv6: mỗi ô 1 IPv6, đổi IP, đổi dải)
#   - thử THẬT: cầu vmbr0 + macvlan + pppd ↔ pppoe-server (nhiều phiên, mỗi phiên 1 IPv4), IPv6 qua NDP thật trên veth
#   - cbproxy: dựng đúng md5 ghim trong windows/phonectl.py + bộ thử iptables thật (đọc SNI / Host)
name: Check cbpool (proxy nhiều IP)
on:
  push:
    branches: ["apppool-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pool:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Dựng cbpool + cbproxy (đúng bản ghim md5)
        run: |
          set -e
          cd cbpool
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::cbpool chưa gofmt"; exit 1; }
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w -buildid=" -o ../cbpool-ci .
          cd ../cbproxy
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w -buildid=" -o ../cbproxy-ci .
          cd ..
          P=$(md5sum cbpool-ci | cut -d' ' -f1); X=$(md5sum cbproxy-ci | cut -d' ' -f1)
          PIN_P=$(grep -oP 'POOL_FILE = \("cbpool-x86_64", "\K[0-9a-f]{32}' proxmox/cbhost.py || true)
          PIN_X=$(grep -oP 'CBPX_FILE = \("cbproxy-x86_64", "\K[0-9a-f]{32}' windows/phonectl.py || true)
          { echo "### Bản dựng"; echo "| file | md5 dựng từ nguồn | md5 ghim | file trong kho |"; echo "|---|---|---|---|";
            echo "| cbpool | $P | $PIN_P | $(md5sum proxmox/cbpool-x86_64 2>/dev/null | cut -d' ' -f1) |";
            echo "| cbproxy | $X | $PIN_X | $(md5sum windows/cbproxy-x86_64 | cut -d' ' -f1) |"; } >> $GITHUB_STEP_SUMMARY
          [ "$P" = "$PIN_P" ] && cmp -s cbpool-ci proxmox/cbpool-x86_64 || { echo "::error::cbpool dựng ra $P ≠ ghim $PIN_P / file trong kho"; exit 1; }
          [ "$X" = "$PIN_X" ] && cmp -s cbproxy-ci windows/cbproxy-x86_64 || { echo "::error::cbproxy dựng ra $X ≠ ghim $PIN_X / file trong kho"; exit 1; }
      - name: Bộ thử Go cbpool (không gian mạng riêng, có IPv6)
        run: |
          set -o pipefail
          cd cbpool && go test -c -o /tmp/cbpool.test .
          sudo unshare -n env CBPOOL_NETNS_TEST=1 /tmp/cbpool.test -test.v 2>&1 | tee /tmp/gotest.txt
          grep -q '^PASS' /tmp/gotest.txt
          if grep -q -- '--- SKIP' /tmp/gotest.txt; then echo "::error::CI phải chạy cả phần IPv6"; exit 1; fi
          { echo "### Bộ thử Go"; echo '```'; grep -E '^(--- |    cbpool_test|PASS|FAIL)' /tmp/gotest.txt || true; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Cài ppp + pppoe-server
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ppp pppoe curl
          sudo modprobe pppoe || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe pppoe; }
          sudo modprobe macvlan
          ls /usr/lib/pppd/*/ | head
      - name: Thử thật cbpool — vmbr0 + PPPoE nhiều phiên + IPv6 qua NDP
        run: sudo python3 .github/cbpool-check/test_pool_net.py ./cbpool-ci | tee -a $GITHUB_STEP_SUMMARY; exit ${PIPESTATUS[0]}
      - name: cbhost (kho proxy) + cbproxy (iptables thật) + phonectl
        if: always()
        run: |
          set -o pipefail
          python3 proxmox/tests/test_cbhost.py > /tmp/h.txt 2>&1; h=$?
          sudo python3 cbproxy/test_cbproxy.py ./cbproxy-ci > /tmp/x.txt 2>&1; x=$?
          python3 cbproxy/test_proxy_server.py > /tmp/s.txt 2>&1; s=$?
          { echo "### cbhost: $(tail -1 /tmp/h.txt) · cbproxy: $(tail -1 /tmp/x.txt) · phonectl proxy: $(tail -1 /tmp/s.txt)"; echo '```'; grep "✗" /tmp/h.txt /tmp/x.txt /tmp/s.txt | head -20 || true; echo '```'; } >> $GITHUB_STEP_SUMMARY
          exit $((h | x | s))
      - name: Lưu bản dựng
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbpool
          path: |
            cbpool-ci
            cbproxy-ci
            /tmp/cbp/cbpool.log
          if-no-files-found: ignore
