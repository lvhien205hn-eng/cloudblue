plugins {
    id 'com.android.application'
}

// Phiên bản app: tự tăng theo số lần GitHub build (APP_VERSION_CODE do workflow truyền vào)
def vCode = (System.getenv("APP_VERSION_CODE") ?: "1") as Integer
def ksPath = System.getenv("KEYSTORE_FILE")
def hasKey = ksPath != null && new File(ksPath).exists()
def ksPass = System.getenv("KEYSTORE_PASSWORD")
def keyAliasName = System.getenv("KEY_ALIAS") ?: "blueroblox"
def keyPass = System.getenv("KEY_PASSWORD") ?: ksPass

android {
    namespace = 'shop.blueroblox.app'
    compileSdk = 36

    defaultConfig {
        applicationId = "shop.blueroblox.app"
        minSdk = 24
        targetSdk = 36
        versionCode = vCode
        versionName = "1." + vCode
    }

    signingConfigs {
        release {
            if (hasKey) {
                storeFile = file(ksPath)
                storePassword = ksPass
                keyAlias = keyAliasName
                keyPassword = keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    // 2 bản app, GitHub build cả 2 mỗi lần (cùng số bản):
    //  • web  = shop.blueroblox.app — tải từ cloudblue.vn (file .apk): đủ tính năng, tự cập nhật ngay trong app như cũ.
    //  • play = vn.cloudblue.app    — bản CH Play (file .aab): không nạp / thuê / gia hạn trong app (luật thanh toán Google Play),
    //    không tự tải / cài APK, cập nhật QUA Google Play (CH Play tự cập nhật + hộp "Có bản cập nhật mới" trong app).
    //    Ký bằng cùng khoá (dùng làm "khoá tải lên" của Play Console). Mã nguồn riêng: src/play (Updater, manifest), src/web (Updater cũ).
    flavorDimensions "store"
    productFlavors {
        web {
            dimension = "store"
        }
        play {
            dimension = "store"
            applicationId = "vn.cloudblue.app"
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Bản CH Play: hộp "Có bản cập nhật mới" + cập nhật ngay trong app QUA Google Play (In-App Updates). Bản web không dùng.
    playImplementation 'com.google.android.play:app-update:2.1.0'
}
