<style>
/* ===== Bảng quản trị gọn (21/11f): 5 nhóm — mỗi nhóm 1 màu, ghi sẵn các mục bên trong — + hàng mục con của nhóm đang mở ===== */
.admgrp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:4px 0 10px}
.admgrp button{--ac:#3d86ff;position:relative;display:flex;align-items:flex-start;gap:11px;min-width:0;padding:12px 13px 13px;border-radius:16px;cursor:pointer;text-align:left;font:inherit;color:var(--fg);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--ac) 38%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 16%,transparent),color-mix(in srgb,var(--ac) 4%,transparent) 70%),var(--panel);
  box-shadow:0 10px 24px -18px color-mix(in srgb,var(--ac) 80%,transparent);
  transition:transform .14s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
.admgrp button::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ac);opacity:0;transform:scaleX(.4);transition:opacity .18s ease,transform .22s ease}
.admgrp button:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--ac) 65%,transparent);box-shadow:0 14px 28px -16px color-mix(in srgb,var(--ac) 90%,transparent)}
.admgrp button:active{transform:translateY(0) scale(.985)}
.admgrp button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.admgrp button.on{border-color:var(--ac);background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 42%,transparent),color-mix(in srgb,var(--ac) 14%,transparent) 75%),var(--panel);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 55%,transparent) inset,0 16px 32px -14px color-mix(in srgb,var(--ac) 95%,transparent)}
.admgrp button.on::after{opacity:1;transform:none}
.admgrp .gi{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;line-height:1;
  background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 85%,#fff 15%),var(--ac));box-shadow:0 6px 14px -6px var(--ac),inset 0 1px 0 rgba(255,255,255,.35)}
.admgrp .gt{display:grid;gap:3px;min-width:0}
.admgrp .gt b{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admgrp .gt small{font-size:12px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.admgrp button.on .gt small{color:var(--fg);opacity:.82}
.admgrp .badge{flex:none}
/* hàng mục con: thanh viên thuốc, mục đang mở tô màu của nhóm */
#adm-tabs.admsub{--grp-ac:#3d86ff;margin-top:0;margin-bottom:6px;padding:5px;gap:4px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow-x:auto;scrollbar-width:none}
#adm-tabs.admsub::-webkit-scrollbar{display:none}
#adm-tabs.admsub .tsep,#adm-tabs.admsub button[data-grp-off]{display:none!important}
#adm-tabs.admsub button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:8px 14px;border-radius:10px;font-weight:700;transition:background .15s ease,color .15s ease,box-shadow .15s ease}
html[data-theme] #adm-tabs.admsub button.on,#adm-tabs.admsub button.on{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--grp-ac) 82%,#fff 18%),var(--grp-ac));
  box-shadow:0 6px 16px -8px var(--grp-ac)}
#drawer .dbody:not([hidden]){animation:admIn .16s ease-out}
@keyframes admIn{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.admgrp button,.admgrp button::after{transition:none}#drawer .dbody:not([hidden]){animation:none}}
@media (max-width:860px){
  .admgrp{display:flex;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
  .admgrp::-webkit-scrollbar{display:none}
  .admgrp button{flex:0 0 auto;width:min(66vw,240px)}
}
/* ===== CĂN LỀ THỐNG NHẤT (21/11h) — mọi khối giữa tiêu đề và nội dung (cảnh báo máy chủ, 🔔 máy sắp hết hạn, dải đơn chờ, 5 nhóm,
   thanh mục con) cùng mép trái / phải với chữ tiêu đề và với nội dung từng thẻ:
   · cửa sổ quản trị bên phải (mở từ trang chủ): lề 20px
   · trang /admin: cột giữa rộng tối đa 1600px (nội dung 1560px), màn hẹp hơn: lề 20px
   · khung nội dung cuộn riêng: thanh cuộn nằm sát mép phải màn hình, lề phải trừ đúng bề rộng thanh cuộn (--adm-sb, đo bằng mã) → mép phải vẫn thẳng hàng */
#drawer .dpanel{--adm-gx:20px}
body.admin-page #drawer .dpanel{--adm-gx:max(20px,calc((100% - 1560px) / 2))}
#drawer .dpanel>:not(.dhead):not(.dbody){width:auto;max-width:none;margin-left:var(--adm-gx);margin-right:var(--adm-gx)}
body.admin-page #drawer .dpanel>:not(.dhead):not(.dbody){width:auto;max-width:none;margin-left:var(--adm-gx);margin-right:var(--adm-gx)}
body.admin-page #drawer .dpanel>.dhead{width:100%;max-width:none;margin-left:0;margin-right:0;padding-left:var(--adm-gx);padding-right:var(--adm-gx)}
#drawer .dpanel>.dbody{scrollbar-gutter:stable;padding-left:var(--adm-gx);padding-right:max(4px,calc(var(--adm-gx) - var(--adm-sb,0px)))}
body.admin-page #drawer .dpanel>.dbody{width:100%;max-width:none;margin-left:0;margin-right:0;padding-left:var(--adm-gx);padding-right:max(4px,calc(var(--adm-gx) - var(--adm-sb,0px)))}
/* điện thoại: tiêu đề 1 dòng riêng, 3 nút (Tải lại · Đăng xuất · Đóng) chung 1 dòng bên dưới — không còn nút "Đóng" lẻ loi */
@media (max-width:520px){#drawer .dhead h2{flex-basis:100%}#drawer .dhead{row-gap:10px}}
</style>
<script>
/* Gộp thẻ bảng quản trị theo nhóm. Không đổi gì bên trong các thẻ: nút thẻ cũ (#adm-tabs button[data-tab]) vẫn là nút thật —
   bấm nhóm = bấm nút thẻ cũ (mục dùng gần nhất của nhóm); hàng #adm-tabs chỉ còn các mục của nhóm đang mở.
   Mượt: bấm là nhóm / mục sáng NGAY (vẽ trước), phần nặng (đổi khung + tải dữ liệu) chạy ở khung hình sau. */
(() => {
  const tabs = document.getElementById("adm-tabs"); if (!tabs || document.getElementById("adm-grp")) return;
  const G = [
    { id: "home", ic: "📊", t: "Tổng quan", ac: "#3d86ff", m: ["stats"], d: "Doanh thu · đơn · sản phẩm bán chạy" },
    { id: "sell", ic: "🛒", t: "Bán hàng", ac: "#f59e0b", m: ["ord", "prod", "promo"] },
    { id: "cust", ic: "👥", t: "Khách & tiền", ac: "#10b981", m: ["cust", "tx", "sec"] },
    { id: "mach", ic: "🖥️", t: "Máy cho thuê", ac: "#8b5cf6", m: ["cloud", "vps", "pc", "biz"] },
    { id: "set", ic: "⚙️", t: "Cài đặt", ac: "#06b6d4", m: ["site", "bank"] }
  ];
  const btnOf = t => tabs.querySelector('button[data-tab="' + t + '"]');
  const label = b => { const c = b.cloneNode(true); c.querySelectorAll(".badge").forEach(x => x.remove()); return c.textContent.replace(/^[^\p{L}\p{N}]+/u, "").trim(); };
  // thẻ mới chưa có nhóm (bản sau thêm) → nhóm "Khác" ở cuối, không bao giờ bị mất
  const known = new Set(G.flatMap(g => g.m)), extra = [...tabs.querySelectorAll("button[data-tab]")].map(b => b.dataset.tab).filter(t => !known.has(t));
  if (extra.length) G.push({ id: "more", ic: "➕", t: "Khác", ac: "#64748b", m: extra });
  const grpOf = t => (G.find(g => g.m.includes(t)) || {}).id || null;
  const gOf = id => G.find(x => x.id === id);
  const bar = document.createElement("div"); bar.className = "admgrp"; bar.id = "adm-grp"; bar.setAttribute("role", "tablist"); bar.setAttribute("aria-label", "Nhóm chức năng");
  for (const g of G) {
    const ms = g.m.map(btnOf).filter(Boolean); if (!ms.length) continue;
    let d = g.d;
    if (!d) {                                                      // 1 thẻ có mục con (Cài đặt) → liệt kê mục con; nhiều thẻ → liệt kê tên thẻ
      const sub = ms.length === 1 ? [...document.querySelectorAll("#pane-" + g.m[0] + " > .subtabs button[data-sub]")] : [];
      d = (sub.length ? sub.map(label) : ms.map(label)).join(" · ");
    }
    const b = document.createElement("button"); b.type = "button"; b.dataset.grp = g.id; b.setAttribute("role", "tab"); b.style.setProperty("--ac", g.ac);
    b.innerHTML = `<span class="gi" aria-hidden="true">${g.ic}</span><span class="gt"><b>${g.t} <span class="badge" hidden></span></b><small></small></span>`;
    b.querySelector("small").textContent = d; b.title = d;
    bar.appendChild(b);
  }
  tabs.before(bar); tabs.classList.add("admsub");
  const last = g => { try { return localStorage.getItem("adm_grp_" + g); } catch (e) { return null; } };
  const later = f => requestAnimationFrame(() => setTimeout(f, 0));          // để trình duyệt vẽ trạng thái mới trước, rồi mới làm phần nặng
  let pending = null;
  function show(gid, tab) {                                                  // sáng ngay: nhóm + hàng mục con + mục sẽ mở
    bar.querySelectorAll("button[data-grp]").forEach(x => { const on = x.dataset.grp === gid; x.classList.toggle("on", on); x.setAttribute("aria-selected", on ? "true" : "false"); });
    tabs.style.setProperty("--grp-ac", (gOf(gid) || {}).ac || "#3d86ff");
    let shown = 0;
    tabs.querySelectorAll("button[data-tab]").forEach(x => {
      const mine = grpOf(x.dataset.tab) === gid;
      if (mine) { shown++; if (x.hasAttribute("data-grp-off")) x.removeAttribute("data-grp-off"); } else if (!x.hasAttribute("data-grp-off")) x.setAttribute("data-grp-off", "");
      if (tab && mine) x.classList.toggle("on", x.dataset.tab === tab);
    });
    const disp = shown > 1 ? "" : "none"; if (tabs.style.display !== disp) tabs.style.display = disp;
    seeSub();
  }
  function seeSub() {                                                        // màn hẹp (hàng mục con cuộn ngang) → mục đang mở luôn nằm trong tầm nhìn
    if (tabs.scrollWidth <= tabs.clientWidth + 4) return;
    const b = tabs.querySelector("button[data-tab].on:not([data-grp-off])"); if (!b) return;
    const tr = tabs.getBoundingClientRect(), br = b.getBoundingClientRect();
    if (br.left >= tr.left + 4 && br.right <= tr.right - 4) return;
    const x = tabs.scrollLeft + (br.left - tr.left) - (tabs.clientWidth - br.width) / 2;
    try { tabs.scrollTo({ left: Math.max(0, x), behavior: "smooth" }); } catch (e) { tabs.scrollLeft = Math.max(0, x); }
  }
  function go(tab) {
    const tb = btnOf(tab); if (!tb) return;
    show(grpOf(tab), tab); pending = tab;
    later(() => { if (pending !== tab) return; pending = null; tb.click(); });
  }
  bar.addEventListener("click", e => {
    const b = e.target.closest("button[data-grp]"); if (!b) return;
    const g = gOf(b.dataset.grp); if (!g) return;
    const want = [last(g.id), ...g.m].find(t => t && g.m.includes(t) && btnOf(t));
    const tb = want && btnOf(want); if (tb && !tb.classList.contains("on")) go(want); else paint();
  });
  function paint() {
    const on = tabs.querySelector("button[data-tab].on"), cur = pending || (on ? on.dataset.tab : null), cg = grpOf(cur);
    if (cur && cg && !pending) { try { localStorage.setItem("adm_grp_" + cg, cur); } catch (e) {} }
    show(cg, null);
    bar.querySelectorAll("button[data-grp]").forEach(b => {
      const g = gOf(b.dataset.grp), isOn = g.id === cg;
      if (isOn && !b.dataset.seen && bar.scrollWidth > bar.clientWidth + 4) {   // màn hẹp (hàng nhóm cuộn ngang) → kéo nhóm đang mở vào giữa tầm nhìn
        const x = b.offsetLeft - (bar.clientWidth - b.offsetWidth) / 2; try { bar.scrollTo({ left: Math.max(0, x), behavior: "smooth" }); } catch (e) { bar.scrollLeft = Math.max(0, x); }
      }
      if (isOn) b.dataset.seen = "1"; else delete b.dataset.seen;
      let n = 0, flag = false;                                     // số trên nhóm = cộng số của các thẻ trong nhóm ("!" nếu chỉ có dấu nhắc)
      for (const t of g.m) {
        const bd = btnOf(t) && btnOf(t).querySelector(".badge"); if (!bd || bd.hidden) continue;
        const v = bd.textContent.trim(); if (!v) continue;
        if (/^\d+$/.test(v)) n += +v; else flag = true;
      }
      const s = b.querySelector(".badge"), txt = n ? String(n) : flag ? "!" : "";
      if (s.textContent !== txt) s.textContent = txt;
      if (s.hidden !== !txt) s.hidden = !txt;
    });
  }
  new MutationObserver(paint).observe(tabs, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class", "hidden"] });
  // bề rộng thanh cuộn của khung nội dung (Windows ~17px, điện thoại / Mac 0) → lề phải nội dung trừ đúng chừng đó (thẳng hàng với các khối phía trên)
  const panel = tabs.closest(".dpanel");
  const sbw = () => { try {
    const p = [...panel.querySelectorAll(":scope > .dbody")].find(x => !x.hidden && x.offsetWidth); if (!p) return;
    const cs = getComputedStyle(p), w = Math.max(0, Math.round(p.offsetWidth - p.clientWidth - (parseFloat(cs.borderLeftWidth) || 0) - (parseFloat(cs.borderRightWidth) || 0)));
    if (panel.style.getPropertyValue("--adm-sb") !== w + "px") panel.style.setProperty("--adm-sb", w + "px");
  } catch (e) {} };
  if (panel) { addEventListener("resize", sbw); new MutationObserver(() => requestAnimationFrame(sbw)).observe(panel, { childList: true, attributes: true, attributeFilter: ["hidden"], subtree: true }); requestAnimationFrame(sbw); }
  window.ADMNAV = { grpOf, paint, go, groups: () => G.map(g => ({ id: g.id, t: g.ic + " " + g.t, m: g.m.filter(btnOf) })) };
  paint();
})();
</script>
