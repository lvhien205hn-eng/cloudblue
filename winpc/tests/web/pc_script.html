<style>
/* 💻 Máy PC cho thuê (web 21/11a) */
#pcadlg,#pcrdlg,#pctdlg,#vmdlg{z-index:70}   /* hộp của trang quản trị phải nằm TRÊN bảng quản trị (z 60); #vmdlg (Sửa máy VPS) trước đây thiếu dòng này nên bị che */
.pca-tiles{grid-template-columns:repeat(4,1fr)}
.pca-bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.pca-bar .pca-sp{flex:1 1 auto}
.pca-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.pca-chk input{width:auto}
.pca-row{display:flex;gap:8px;margin:8px 0 4px}
.pca-row .in{flex:1 1 auto;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.pca-wipe{display:grid;gap:8px}
.dlg .pca-wipe label{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--fg);cursor:pointer;line-height:1.45}
.dlg .pca-wipe input{width:auto;margin-top:3px;flex:0 0 auto}
#pctbl td{vertical-align:top}
#pctbl .pca-acts{white-space:nowrap;text-align:right}
#pctbl .pca-actbox{display:inline-grid;grid-template-columns:max-content;gap:5px;justify-items:stretch}      /* các nút từng máy xếp DỌC: bảng thêm cột Hạn thuê mà không phải cuộn ngang */
#pctbl .pca-actbox .btn{margin-left:0}
#pctbl .pca-cfg{font-size:12.5px;line-height:1.5;min-width:190px}
#pctbl .pca-drv{color:#f5b942;font-weight:700}
#pctbl .pca-drvn{white-space:normal;max-width:300px}
#pctbl .pca-rent{min-width:128px}
.pca-al{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:9px 0 6px}
/* 🔔 máy sắp / đã hết hạn: 2 ô cho admin (trang ngoài + Bảng quản trị) và dải nhắc cho khách */
.xp-home{margin-top:10px}
.xp-host{margin:10px 20px 0}
.xp-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 6px;font-size:13.5px}
.xp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;align-items:start}
.xp-box,.xp-cust{border:1px solid var(--line2);border-radius:14px;background:var(--panel);overflow:hidden}
.xp-h{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;background:none;border:0;color:var(--fg);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;text-align:left}
.xp-h span{flex:1 1 auto;min-width:0}
.xp-h i{font-style:normal;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
.xp-l{display:flex;flex-direction:column;gap:6px;padding:0 10px 10px}
.xp-r{padding:8px 11px;border-radius:10px;font-size:13px;line-height:1.45;border:1px solid;overflow-wrap:anywhere}
.xp-r.r{background:rgba(255,107,129,.1);border-color:rgba(255,107,129,.4);color:#ffd4db}
.xp-r.y{background:rgba(255,200,97,.08);border-color:rgba(255,200,97,.35);color:#ffe7b8}
html[data-theme=light] .xp-r.r{color:#c0263c}
html[data-theme=light] .xp-r.y{color:#8a5a00}
.xp-r a{font-weight:700;white-space:nowrap;color:inherit;text-decoration:underline}
.xp-cust{display:flex;flex-direction:column;gap:6px;padding:10px;margin-bottom:10px}
.xp-cust[hidden],.xp-adm[hidden],.xp-home[hidden],.xp-host[hidden]{display:none}
.xp-ch{display:flex;align-items:center;gap:8px;font-size:13.5px}
.xp-ch b{flex:1 1 auto;min-width:0}
.pca-num{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pca-num .in{width:84px;padding:6px 9px}
.pca-row.pca-plain .in{font-family:inherit;font-size:14px}
.pca-row.pca-plain select.in{flex:0 0 104px}
@media (max-width:760px){.pca-tiles{grid-template-columns:1fr 1fr}}
</style>
<script>
/* ===== 💻 MÁY PC CHO THUÊ — trang quản trị (SQL v41 + v42 · web 21/11c) =====
   Máy cài bằng ISO CloudBlue tự đăng ký (pc_enroll) rồi báo sống (pc_poll). Ở đây admin: tạo mã đăng ký, duyệt máy, đổi tên,
   ra lệnh cài lại / đổi Windows / dọn máy / khởi động lại, công bố bản agent. Chưa chạy SQL v41 thì chỉ hiện lời nhắc.
   SQL v42: hạn thuê từng máy (hết hạn máy tự tắt) + cảnh báo về mail / Telegram. Chưa chạy v42 → phần này ẩn, phần còn lại chạy như cũ. */
(function () {
  const $i = id => document.getElementById(id);
  if (!$i("pane-pc") || typeof sb === "undefined" || typeof setTab !== "function") return;
  const TOOL = "https://raw.githubusercontent.com/lvhien205hn-eng/cloudblue/main/winpc";
  const UPD_BASE = "https://raw.githubusercontent.com/lvhien205hn-eng/cloudblue/";
  const CMD = '$d = "$env:TEMP\\cb-tao-iso.ps1"; Remove-Item $d -Force -ErrorAction SilentlyContinue; curl.exe -fsSL -o $d "' + TOOL + '/tao-iso.ps1?t=$(Get-Random)"; if (-not ((Test-Path $d) -and (Select-String -Path $d -Pattern \'cloudblue-tao-iso\' -SimpleMatch -Quiet))) { Write-Host \'Chua tai duoc tao-iso.ps1 - thu lai sau 1 phut\' -ForegroundColor Red } else { Set-ExecutionPolicy -Scope Process Bypass -Force; & $d }';
  const ST = { new: ["Chờ duyệt", "wt"], ready: ["Sẵn sàng", "ok"], rented: ["Đang thuê", ""], maint: ["Bảo trì", "bad"] };
  const WIPE = { all: "dọn sạch cả máy", disk: "cả ổ hệ thống", system: "chỉ phân vùng Windows" };
  const COLS = "id,name,code,note,approved,status,os,os_ver,info,lan_ip,pub_ip,first_seen,last_seen,enrolled_at,reenroll_until,created_at", COLS42 = ",rent_until,renter,rent_set_at,rent_off_at";
  const SETS = "enroll_hash,enroll_made_at,auto_approve,agent,poll_s", SETS42 = ",rent_warn_min,rent_remind_min,off_alert_min,alert_email,notify_at,notify_fail_at,notify_err";
  const ERRS = { NOT_ADMIN: "Tài khoản này không phải admin.", BUSY: "Máy đang có lệnh cài lại chưa xong — chờ xong hoặc huỷ lệnh đó trước.", BAD_OS: "Bản Windows không hợp lệ.",
    BAD_WIPE: "Kiểu xoá không hợp lệ.", NO_MACHINE: "Không còn máy này (đã bị xoá?).", NOT_OPEN: "Lệnh này đã xong hoặc đã huỷ.", BAD_NAME: "Tên máy phải từ 1 đến 40 ký tự.",
    BAD_STATUS: "Trạng thái không hợp lệ.", BAD_AGENT: "Bản kê agent không hợp lệ.", BAD_CMD: "Lệnh không hợp lệ.", BAD_ARGS: "Tham số lệnh không hợp lệ.",
    BAD_PATCH: "Dữ liệu gửi lên không hợp lệ.", BAD_POLL: "Chu kỳ báo sống phải từ 10 đến 600 giây.", BAD_HOURS: "Số giờ gia hạn không hợp lệ (mỗi lần tối đa 366 ngày).",
    BAD_UNTIL: "Thời điểm hết hạn không hợp lệ (phải ở tương lai, xa nhất 2 năm).", BAD_WARN: "Số phút cảnh báo không hợp lệ." };
  // v42: null = chưa biết (thử đọc cột mới) · true = đã chạy cloud-pc-v42.sql · false = chưa chạy (đọc kiểu cũ, không thử lại cho tới khi bấm Tải lại / mở lại thẻ)
  const P = window.PCA = { list: [], orders: [], set: null, miss: false, loaded: false, cur: null, busy: false, again: false, wait: null, loads: 0, v42: null, kickAt: 0 };
  // info / result do MÁY CHO THUÊ gửi lên (khách có quyền admin trên máy đó) → coi là dữ liệu lạ: ép kiểu, cắt ngắn, luôn esc() khi in
  const S = (v, n) => v == null || typeof v === "object" ? "" : String(v).slice(0, n || 80);
  const A = (v, n) => Array.isArray(v) ? v.slice(0, n || 8) : [];
  const O = v => v && typeof v === "object" && !Array.isArray(v) ? v : {};
  const em = e => { const m = String((e && (e.message || e.error_description)) || e || ""); for (const k in ERRS) if (m.includes(k)) return ERRS[k]; return typeof errMsg === "function" ? errMsg(e) : m; };
  const missing = e => /does not exist|schema cache|Could not find|relation .* does not/i.test(String((e && e.message) || ""));
  const noCol = e => !!e && (e.code === "42703" || /column .* does not exist/i.test(String(e.message || "")));
  const pollS = () => Math.max(10, +((P.set && P.set.poll_s) || 30));
  const online = m => !!m.last_seen && (Date.now() - new Date(m.last_seen).getTime()) < Math.max(90, 3 * pollS()) * 1000;
  const openOf = id => P.orders.filter(o => o.pc_id === id && (o.state === "queued" || o.state === "sent"));
  const lastOf = id => P.orders.find(o => o.pc_id === id);
  const mins = t => Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 60000));
  const stOf = v => Object.prototype.hasOwnProperty.call(ST, v) ? ST[v] : [S(v, 20), ""];
  const wipeName = w => Object.prototype.hasOwnProperty.call(WIPE, w) ? WIPE[w] : "?";
  const cmdName = o => o.cmd === "reinstall" ? "Cài lại " + S(O(o.args).os, 12).toUpperCase() + " (" + wipeName(S(O(o.args).wipe) || "all") + ")"
    : o.cmd === "reboot" ? "Khởi động lại" : o.cmd === "shutdown" ? "Tắt máy" : o.cmd === "update" ? "Cập nhật agent" : S(o.cmd, 20);
  const pad2 = n => String(n).padStart(2, "0");
  const atVN = t => { const d = new Date(t); return isNaN(d) ? "?" : pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + " " + pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + (d.getFullYear() !== new Date().getFullYear() ? "/" + d.getFullYear() : ""); };
  const spanTxt = ms => { const s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), mi = Math.floor(s % 3600 / 60);
    return d ? d + " ngày" + (h ? " " + h + " giờ" : "") : h ? h + " giờ" + (mi ? " " + mi + " phút" : "") : mi ? mi + " phút" : "dưới 1 phút"; };
  const leftTxt = ms => spanTxt(Math.ceil(ms / 60000) * 60000);          // đếm ngược: làm tròn LÊN phút (vừa đặt +1 ngày thì ghi "1 ngày", không ghi "23 giờ 59 phút")
  const untilOf = m => { const v = m && m.rent_until, t = typeof v === "string" && /^\d{4}-\d\d-\d\d[T ]\d\d:\d\d/.test(v) ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };   // chỉ nhận dạng ngày giờ chuẩn
  const copy = async (text, btn) => { try { await navigator.clipboard.writeText(text); } catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (e2) {} t.remove(); }
    if (btn) { const o = btn.textContent; btn.textContent = "Đã copy ✓"; setTimeout(() => { btn.textContent = o; }, 1500); } };

  function load(quiet) {                    // đang tải dở mà có yêu cầu mới → tải thêm 1 lượt nữa khi xong (không bỏ sót thay đổi vừa lưu)
    if (!isAdmin()) return Promise.resolve();
    if (P.busy) { P.again = true; return P.wait; }
    P.busy = true;
    P.wait = (async () => { try { do { P.again = false; await loadOnce(quiet); } while (P.again); } catch (e) { if (!quiet) toast(em(e), 1); } finally { P.busy = false; } })();
    return P.wait;
  }
  async function loadOnce(quiet) {
    P.loads++;
    const get = v2 => Promise.all([
      sb.from("pc_machines").select(COLS + (v2 ? COLS42 : "")).order("created_at"),
      sb.from("pc_settings").select(SETS + (v2 ? SETS42 : "")).eq("id", 1).maybeSingle()]);
    let v2 = P.v42 !== false;
    let [[m, st], o] = await Promise.all([get(v2), sb.from("pc_orders").select("id,pc_id,cmd,args,state,result,created_at,sent_at,done_at").order("id", { ascending: false }).limit(300)]);
    if (v2 && (noCol(m.error) || noCol(st.error))) { v2 = false; [m, st] = await get(false); }      // chưa chạy SQL v42: đọc kiểu cũ, phần hạn thuê tạm ẩn
    if (m.error) {
      P.miss = missing(m.error); P.loaded = false;
      try { if (P.miss) sessionStorage.setItem("pca_miss", "1"); } catch (e) {}
      show("pca-miss", P.miss); show("pca-miss42", false);
      if (!P.miss && !quiet) toast(em(m.error), 1);
      P.list = []; P.orders = []; P.set = null; render(); return;
    }
    try { sessionStorage.removeItem("pca_miss"); } catch (e) {}
    P.miss = false; P.loaded = true; P.v42 = v2; show("pca-miss", false); show("pca-miss42", !v2);
    if ((o.error || st.error) && !quiet) toast(em(o.error || st.error), 1);
    P.list = Array.isArray(m.data) ? m.data : [];
    if (!o.error) P.orders = (o.data || []).map(x => { const a = Object.assign({}, O(x.args)); delete a.ticket; return Object.assign({}, x, { args: a }); });    // vé cài lại không giữ trong trang
    if (!st.error) P.set = st.data || null;
    render(); kick();
  }
  // Nhờ /api/pc-notify gửi các cảnh báo máy PC đang chờ về mail + Telegram của admin — tối đa 1 lần / phút khi bảng quản trị đang mở.
  // Cơ sở dữ liệu cũng tự gọi địa chỉ này mỗi phút (pg_cron + pg_net); đây là đường dự phòng. Không gửi kèm gì, không cần đọc trả lời.
  function kick() {
    if (!P.v42 || Date.now() - P.kickAt < 60000) return;
    P.kickAt = Date.now();
    try { fetch("/api/pc-notify", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {}); } catch (e) {}
  }

  // driver của máy (agent 21.11c trở lên gửi info.drv): máy còn THIẾU driver nào — bản Windows cũ (1511) thiếu driver card mạng thì không có mạng, thiếu VGA thì không chơi game được.
  // Chỉ so sánh đúng chữ "miss" / "none" / "basic"; tên thiết bị máy gửi lên luôn qua esc(), tối đa 6 tên.
  function drvLine(i) {
    const d = O(i.drv); if (typeof d.miss !== "number" || !isFinite(d.miss)) return "";
    const n = Math.min(999, Math.max(0, Math.round(+d.miss) || 0)), names = A(d.names, 6).map(x => S(x, 80)).filter(Boolean), bits = [];
    if (d.net === "miss") bits.push("card mạng chưa có driver"); else if (d.net === "none") bits.push("không thấy card mạng");
    if (d.vga === "miss" || d.vga === "basic") bits.push("VGA chưa có driver của hãng");
    if (!n && !bits.length) return '<span class="hint">✓ đủ driver</span>';
    return `<span class="pca-drv" title="${esc(names.join(" · "))}">⚠ thiếu driver${n ? ": " + n + " thiết bị" : ""}${bits.length ? " (" + bits.join(", ") + ")" : ""}</span>`
      + (names.length ? `<div class="hint pca-drvn">${names.slice(0, 3).map(esc).join(" · ")}${n > 3 ? " …" : ""}</div>` : "");
  }
  function cfgCell(m) {
    const i = O(m.info), out = [], cpu = S(i.cpu, 70).replace(/\(R\)|\(TM\)|CPU /g, "").replace(/\s+/g, " ").trim(), cores = Math.round(+i.cores) || 0, ram = Math.round(+i.ram_gb) || 0;
    const gpus = A(i.gpus, 6).map(g => S(g, 60)).filter(Boolean), disks = A(i.disks, 8).map(O);
    if (cpu || cores) out.push(esc(cpu || "CPU ?") + (cores ? " · " + cores + " luồng" : ""));
    if (ram || S(i.board)) out.push((ram ? ram + "GB RAM" : "") + (ram && S(i.board) ? " · " : "") + esc(S(i.board, 60)));
    if (gpus.length) out.push("🎮 " + gpus.map(esc).join(", "));
    if (disks.length) out.push("💽 " + disks.map(d => (Math.round(+d.gb) || "?") + "GB" + (d.ssd === true ? " SSD" : d.ssd === false ? " HDD" : "")).join(" + "));
    const dl = drvLine(i); if (dl) out.push(dl);
    return out.length ? out.join("<br>") : '<span class="hint">chưa có thông tin</span>';
  }
  const recOf = m => { const r = O(O(m.info).rec), imgs = A(r.images, 8).map(x => S(x, 12)).filter(x => /^[a-z0-9]{2,12}$/.test(x)); return { ok: r.ok === true && imgs.length > 0, images: imgs }; };

  // Khoảng báo trước THỰC TẾ của 1 máy (mili giây) — cùng công thức với hàm SQL _pc_warn_min: số nhỏ hơn giữa cài đặt chung và 1/4 thời gian thuê (ít nhất 10 phút).
  function warnMsOf(m) {
    const w = +(P.set && P.set.rent_warn_min) || 0, u = untilOf(m);
    if (!(w > 0) || u === null) return 0;
    const t0 = new Date(m.rent_set_at || m.created_at).getTime(), term = isNaN(t0) ? Infinity : (u - t0) / 60000;
    return Math.min(w, Math.max(10, Math.floor(term * 0.25))) * 60000;
  }
  const rentSoon = m => { const u = untilOf(m), left = u === null ? NaN : u - Date.now(); return left > 0 && left <= warnMsOf(m); };
  const rentOver = m => { const u = untilOf(m); return u !== null && u <= Date.now(); };
  // ======================= 🔔 MÁY SẮP / ĐÃ HẾT HẠN =======================
  // ADMIN: 2 ô — "VPS / Máy PC" và "ĐT đám mây" — hiện ở TRANG NGOÀI (ngay dưới thanh đầu trang) và ở đầu Bảng quản trị (mọi tab); mỗi ô bấm Ẩn / Hiện được (nhớ theo trình duyệt).
  //        Chỉ dựng khi isAdmin(); dữ liệu chỉ tải khi là admin, đăng xuất / đổi tài khoản là xoá sạch. Phía máy chủ, tài khoản thường vốn chỉ đọc được máy của chính mình.
  // KHÁCH: 1 dải nhắc ở trang ngoài cho máy CỦA CHÍNH KHÁCH còn ≤ 2 ngày (ĐT đám mây + máy VPS), có nút Gia hạn; bấm Ẩn thì 4 giờ sau hiện lại.
  const XP_SOON = 2 * 864e5, XP_CUST_HIDE = 4 * 3600e3, XP_MAX = 6;
  const XP = { vps: [], cp: [], names: {}, mine: [], at: 0, busy: false, cat: 0, cbusy: false, uid: null };
  const me = () => { try { return typeof profile !== "undefined" && profile ? profile : null; } catch (e) { return null; } };
  const xpT = v => { const t = typeof v === "string" ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
  const xpGrace = () => { try { return typeof CP_GRACE_MIN === "number" ? CP_GRACE_MIN : 30; } catch (e) { return 30; } };
  const xpHidden = k => { try { return localStorage.getItem("xp_hide_" + k) === "1"; } catch (e) { return false; } };
  const xpPcRows = () => P.loaded && P.v42 ? P.list.filter(m => rentSoon(m) || rentOver(m)) : [];
  function xpItems() {                       // [{t: hạn, over: đã hết hạn?, html, go: tab quản trị, id, btn}] cho từng ô
    const now = Date.now(), who = id => { const n = S(XP.names[id], 40); return n ? ` · 👤 ${esc(n)}` : ""; };
    const A = xpPcRows().map(m => { const u = untilOf(m), over = u <= now, r = (S(m.code, 40) ? ` (№ ${esc(S(m.code, 40))})` : "") + (S(m.renter, 80) ? ` · 👤 ${esc(S(m.renter, 80))}` : "");
      return { t: u, over, go: "pc", id: m.id, btn: "⏱ Gia hạn", html: over
        ? `💻 Máy PC <b>${esc(m.name)}</b>${r} đã <b>HẾT HẠN thuê</b> từ ${atVN(u)} — ${m.rent_off_at ? "máy đã tự tắt" : online(m) ? "máy đang tự tắt" : "máy đang tắt"}.`
        : `💻 Máy PC <b>${esc(m.name)}</b>${r} còn <b>${leftTxt(u - now)}</b> là hết hạn thuê (đến ${atVN(u)}).` }; });
    XP.vps.forEach(v => { const u = xpT(v.expires_at); if (u === null || v.status !== "active" || u - now > XP_SOON) return;
      const nm = `🖥️ VPS <b>${esc(S(v.machine_name, 60) || "?")}</b>${who(v.user_id)}`;
      A.push({ t: u, over: u <= now, go: "vps", id: "", btn: "Mở Máy VPS", html: u <= now ? `${nm} đã <b>HẾT HẠN</b> từ ${atVN(u)}.` : `${nm} còn <b>${leftTxt(u - now)}</b> là hết hạn (đến ${atVN(u)}).` }); });

    const b = e.currentTarget, out = $i("pca-al-r"); b.disabled = true; out.textContent = "Đang gửi thử…";
    try {
      const headers = typeof tgHeaders === "function" ? await tgHeaders() : { "Content-Type": "application/json" };
      const r = await fetch("/api/pc-notify", { method: "POST", headers, body: JSON.stringify({ test: true }) });
      let j = null; try { j = await r.json(); } catch (er) {}
      if (!r.ok || !j) { out.textContent = r.status === 404 ? "Web chưa có /api/pc-notify (chưa cập nhật bản web mới)." : r.status === 401 ? "Phiên đăng nhập hết hạn — đăng nhập lại rồi thử." : r.status === 429 ? "Gửi thử quá dồn dập — chờ 1 phút." : "Gửi thử lỗi (mã " + r.status + ")."; return; }
      const part = (name, x) => x && x.ok ? `<b style="color:var(--ok)">✓ ${name}</b>` : `<b style="color:var(--bad)">✗ ${name}</b>: ${esc(S(x && x.reason, 160) || "không rõ lý do")}`;
      out.innerHTML = "Gửi thử — " + part("Mail", j.mail) + " · " + part("Telegram", j.tg);
    } catch (er) { out.textContent = "Lỗi kết nối khi gửi thử."; } finally { b.disabled = false; }
  };

  // ---- 🔔 gắn phần "máy sắp / đã hết hạn": chỗ đặt ở trang ngoài tạo bằng mã (ngay trên ô "máy của tôi"), bắt bấm, theo dõi đăng nhập
  { const home = document.createElement("section"); home.className = "wrap xp-home"; home.id = "xp-home"; home.hidden = true;
    home.innerHTML = '<div class="xp-cust" id="xp-cust" hidden></div><div class="xp-adm" id="xp-adm" hidden></div>';
    const at = $i("m3-mine"); if (at && at.parentNode) at.parentNode.insertBefore(home, at); else document.body.appendChild(home);
    home.addEventListener("click", xpClick);
    const rb = $i("pca-rentbar"); if (rb) rb.addEventListener("click", xpClick);
    if (typeof renderUser === "function") { const _ru = renderUser; renderUser = function () { const r = _ru.apply(this, arguments); try { xpAuth(); } catch (e) {} return r; }; }
    try { xpAuth(); } catch (e) {} }

  // ---- gắn vào thanh tab của trang quản trị (cùng kiểu các mục khác: bọc setTab / openAdmin)
  { const _st = setTab; setTab = function (t) { _st(t); show("pane-pc", t === "pc"); if (t === "pc") { if (P.v42 === false) P.v42 = null; load(); } }; }
  { const _oa = openAdmin; openAdmin = async function () { const r = await _oa.apply(this, arguments); let skip = false; try { skip = sessionStorage.getItem("pca_miss") === "1"; } catch (e) {} if (!skip) load(true);
      xpLoad(false);
      try { const g = sessionStorage.getItem("xp_go"); if (g) { sessionStorage.removeItem("xp_go"); const i = g.indexOf("|"); xpGo(g.slice(0, i), g.slice(i + 1)); } } catch (e) {}      // từ trang ngoài bấm 1 dòng 🔔 → mở đúng tab
      return r; }; }
  let _tick = 0;
  setInterval(() => { try {
    _tick++;
    if (document.hidden) return;
    const dlgOpen = !$i("pcadlg").hidden || !$i("pcrdlg").hidden || !$i("pctdlg").hidden, inAdm = !$i("drawer").hidden;
    if (isAdmin()) {
      if (inAdm && !$i("pane-pc").hidden) { if (!dlgOpen) load(true); }                       // đang mở tab Máy PC: 15 giây / lần (như cũ)
      else if (_tick % 4 === 0 && P.loaded && P.v42 && !dlgOpen) load(true);                    // tab khác / trang ngoài: 60 giây / lần
      xpLoad(false);                                                                            // VPS + ĐT đám mây: tối đa 1 lần / 55 giây
    } else if (me()) xpMine(false);                                                             // khách: 5 phút / lần
    xpRender();                                                                                 // chữ "còn …" tự chạy theo đồng hồ
  } catch (e) {} }, 15000);
})();
</script>
