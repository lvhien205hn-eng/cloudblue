<style>
/* ===== VPS GPU (máy PC thật) — mua tự động · VPS của khách · đơn chờ cho admin (SQL v43) ===== */

.pcs-dlg .vps-opts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

.pcs-adm{display:grid;gap:10px;margin-bottom:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--soft)}

  .pcs-rc{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border-radius:12px;border:1px dashed rgba(124,188,255,.35);background:rgba(61,134,255,.06)}
  .pcs-rc>b{flex-basis:100%;font-size:13px}

#pcsdlg{z-index:70}   /* hộp của phần VPS GPU nằm TRÊN bảng quản trị (z 60) khi admin bấm Bàn giao */

/* "VPS của tôi" (menu bên): VPS GPU ở đầu hộp, điều khiển ngay trên web — tách riêng khỏi "ĐT đám mây của tôi" */

#pcs-mine-mt{grid-column:1/-1}

/* 21/11f · hộp mua VPS GPU tự động — thẻ cấu hình nổi bật, ① Windows · ② thời gian thuê (giá / ngày, % tiết kiệm) */
#modal.pcauto .dlg{width:min(560px,100%)}
#modal.pcauto #m-title,#modal.pcauto #m-name,#modal.pcauto #m-desc{display:none!important}
.pcs-hero{position:relative;display:grid;gap:10px;padding:16px 16px 14px;border-radius:18px;color:#fff;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,rgba(140,196,255,.28),transparent 55%),linear-gradient(135deg,#1d48b8,#11286e 58%,#2b1f78);
  box-shadow:inset 0 0 0 1px rgba(160,200,255,.35),0 18px 40px -24px rgba(29,72,184,.9)}
.pcs-hero[hidden]{display:none}
.pcs-hero .ph-top{display:flex;align-items:center;gap:12px}

.pcs-hero .ph-t{flex:1;min-width:0;display:grid;gap:2px}
.pcs-hero .ph-t b{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.pcs-hero .ph-t small{font-size:12.5px;color:#cfe0ff}
.pcs-hero .ph-pill{flex:none;align-self:flex-start;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(61,220,151,.18);color:#7ff0bd;box-shadow:inset 0 0 0 1px rgba(61,220,151,.55)}
.pcs-hero .ph-pill.wt{background:rgba(255,200,97,.16);color:#ffd88a;box-shadow:inset 0 0 0 1px rgba(255,200,97,.55)}
.pcs-hero .ph-chips,.pcs-hero .ph-bn{display:flex;flex-wrap:wrap;gap:6px}
.pcs-hero .ph-chips span{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}

.pcs-hero .ph-price small{font-size:12.5px;color:#cfe0ff}
.pcs-hero .ph-price b{font-size:24px;font-weight:800}
#modal.pcauto .pcs-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700}
#modal.pcauto .pcs-sec small{font-size:12px;font-weight:500;color:var(--muted)}
#modal.pcauto #pcs-os .vps-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#modal.pcauto #pcs-os .vps-opts button{display:grid;justify-items:center;gap:1px;padding:10px 8px 11px;text-align:center}
#modal.pcauto #pcs-os .vps-opts button .k0{font-size:11.5px;color:var(--muted);font-weight:700}
#modal.pcauto #pcs-os .vps-opts button b{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
#modal.pcauto #pcs-os .vps-opts button.on{border-color:var(--sky);background:linear-gradient(180deg,rgba(61,123,255,.30),rgba(61,123,255,.12));box-shadow:0 0 0 1px var(--sky) inset}
.pcs-oshint{font-size:12.5px;line-height:1.45}
.pcs-oshint.fast{color:var(--ok)} .pcs-oshint.slow{color:var(--warn,#ffc861)}
#modal.pcauto #m-plans-box>span{font-size:13.5px!important;font-weight:700;color:var(--fg)!important}
#modal.pcauto #m-plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
#modal.pcauto #m-plans button{position:relative;display:grid;justify-items:center;gap:2px;padding:10px 6px 9px}
#modal.pcauto #m-plans button .pd{font-style:normal;font-size:11.5px;color:var(--muted)}
#modal.pcauto #m-plans button.best{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
#modal.pcauto #m-plans button .sv{position:absolute;top:-8px;right:-6px;white-space:nowrap;font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--ok);color:#032a1f;box-shadow:0 0 0 2px var(--bg)}
#modal.pcauto .pcs-how{font-size:12px}
/* hộp sau khi mua: ① đợi máy · ② nội dung gửi admin (ẩn / hiện) */
.pcsw .big{font-size:42px}
.pcsw-code{color:var(--gold-hi);font-family:var(--mono,monospace);font-size:16px}
.pcsw-box{display:grid;gap:7px;text-align:left;padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--line2)}
.pcsw-h,.pcsw-msg summary{font-size:13px;font-weight:800;color:var(--muted)}
.pcsw-box>b{font-size:17px}
.pcsw-box small{color:var(--muted);font-size:13px;line-height:1.5}
.pcsw-box .pcs-bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.pcsw-box .pcs-bar[hidden]{display:none}
.pcsw-box .pcs-bar i{display:block;height:100%;width:35%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--sky));animation:pcsrun 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pcsw-box .pcs-bar i{animation:none;width:100%;opacity:.5}}
.pcsw-acts{display:flex;flex-wrap:wrap;gap:8px}
.pcsw-acts:empty{display:none}
.pcsw-msg{text-align:left;border-radius:14px;border:1px solid var(--line2);padding:10px 12px}
.pcsw-msg summary{cursor:pointer;color:var(--fg)}
.pcsw-msg.late{border-color:rgba(255,200,97,.75);background:rgba(255,200,97,.07)}
.pcsw-late{margin-top:8px;font-size:13px;color:var(--warn,#ffc861);font-weight:700}
.pcsw-msg pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 var(--mono,monospace);background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:190px;overflow:auto;margin:10px 0}
.pcsw-msg .btn{width:100%;justify-content:center}
</style>
<script>
/* ===== VPS GPU tự động (SQL v43). Không có v43 → mọi phần dưới tự ẩn, cửa hàng chạy như cũ. ===== */
(() => {
  const $i = id => document.getElementById(id);
  const S = (v, n) => v == null || typeof v === "object" ? "" : String(v).slice(0, n || 80);
  const A = v => Array.isArray(v) ? v : [];
  const O = v => v && typeof v === "object" && !Array.isArray(v) ? v : {};
  const T = v => { const t = typeof v === "string" ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
  const hm = t => { const d = new Date(t); return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + (new Date().toDateString() === d.toDateString() ? "" : " " + d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" })); };
  const me = () => { try { return typeof profile !== "undefined" && profile ? profile : null; } catch (e) { return null; } };
  const isAdm = () => { const u = me(); return !!u && u.role === "admin"; };
  const ERR = {
    NOT_AUTO: ["Sản phẩm này chưa bật giao máy tự động.", "Automatic delivery is off for this product."],
    BAD_OS: ["Chọn bản Windows.", "Choose a Windows version."], BAD_PLAN: ["Chọn thời gian thuê.", "Choose a rental period."],
    SLOW_DOWN: ["Bạn thao tác hơi nhanh — thử lại sau ít phút.", "Too many requests — try again in a few minutes."],
    NO_LEFT: ["Máy này đã hết lượt cài lại trong lượt thuê. Nhắn shop nếu cần thêm.", "No reinstalls left for this rental. Contact the shop."],
    BUSY: ["Máy đang cài Windows — chờ xong rồi thử lại.", "Windows is being installed — try again when it finishes."],
    EXPIRED: ["Máy đã hết hạn — gia hạn trước.", "This machine has expired — renew first."],
    NOT_ALLOWED: ["Máy này không thuộc tài khoản của bạn.", "This machine is not on your account."],
    PC_IN_USE: ["Máy này đang có khách còn hạn.", "This machine is rented by another customer."],
    CLOSED: ["Lượt thuê này đã kết thúc.", "This rental has ended."], NO_RENTAL: ["Không tìm thấy lượt thuê.", "Rental not found."],
    NOT_APPROVED: ["Máy chưa duyệt.", "Machine not approved."], SAME_PC: ["Khách đang dùng đúng máy này rồi.", "Already on this machine."],
    NO_PRODUCT: ["Không có sản phẩm này.", "No such product."], BAD_MAX: ["Số lần cài lại phải từ 0 đến 20.", "Reinstalls must be 0–20."],
    NOT_FREE: ["Máy này vừa có khách / đang tự cài sạch — chọn máy khác.", "That machine is busy — pick another."], NOT_PENDING: ["Đơn này đã giao / đã huỷ.", "This order is no longer pending."],
    QTY: ["Đơn nhiều máy: giao tay bằng ô tên máy bên dưới.", "Multi-machine order: deliver manually below."], BAD_DAYS: ["Đơn không có số ngày thuê.", "The order has no rental days."],
    HAS_RENTAL: ["Đơn này đã có máy rồi.", "This order already has a machine."], NO_ORDER: ["Không tìm thấy đơn.", "Order not found."]
  };
  const em = e => { const m = String((e && (e.message || e.error_description)) || e || ""); for (const k in ERR) if (m.includes(k)) return L(ERR[k][0], ERR[k][1]);
    try { return errMsg(e); } catch (x) { return m || L("Lỗi không rõ.", "Unknown error."); } };
  const missing = e => /does not exist|schema cache|Could not find|PGRST202/i.test(String((e && (e.message || e.code)) || ""));
  // 21/11f · 🛠️ BẢO TRÌ RIÊNG VPS GPU (Cài đặt → Bảo trì): khoá mua mới, điều khiển, cài lại — khách vẫn gia hạn; admin dùng bình thường
  const pcMaint = () => { try { return typeof SITE !== "undefined" && !!SITE && !!SITE.pc_maint && !isAdm(); } catch (e) { return false; } };
  const pcMaintMsg = () => { let m = ""; try { m = S(SITE.pc_maint_msg, 200).trim(); } catch (e) {}
    return "🛠️ " + L("VPS GPU đang bảo trì", "GPU VPS is under maintenance") + (m ? " — " + m : "") + ". " + L("Máy và dữ liệu của bạn vẫn giữ nguyên.", "Your machine and data are kept."); };
  const maintBar = () => pcMaint() ? `<div class="pcs-maint">${esc(pcMaintMsg())}</div>` : "";
  const left = iso => { const t = T(iso); return t === null ? null : t - Date.now(); };
  const PC = window.PCSHOP = { info: null, infoAt: 0, mine: null, mineAt: 0, adm: null, os: "", busy: false, dlg: null };

  // ---------------------------------------------------------------- thông tin bán (ai cũng xem được)
  async function info(force) {
    if (!force && PC.info && Date.now() - PC.infoAt < 30000) return PC.info;
    try { const { data, error } = await sb.rpc("pc_shop_info"); PC.info = error ? { on: false, miss: missing(error) } : O(data); }
    catch (e) { PC.info = { on: false }; }
    PC.infoAt = Date.now(); return PC.info;
  }
  const autoP = p => !!p && !!PC.info && PC.info.on === true && S(PC.info.product, 40) === S(p.id, 40);

  // ---------------------------------------------------------------- MUA: hộp "Mua sản phẩm" của VPS GPU tự động
  function osBox() {
    let b = $i("pcs-os");
    if (!b) { b = document.createElement("div"); b.id = "pcs-os"; b.className = "pcs-os"; $i("m-plans-box").before(b); }      // ① Windows rồi ② thời gian (như app)
    return b;
  }
  const osSplit = n => { n = S(n, 60).trim(); const i = n.lastIndexOf(" "); return i > 0 ? [n.slice(0, i), n.slice(i + 1)] : ["Windows", n]; };
  function osPaint() {
    const b = osBox(), I = O(PC.info), os = A(I.os);
    if (!os.some(o => o.id === PC.os)) PC.os = (os.find(o => o.fast) || os[0] || {}).id || "";
    const mx = +I.reinstall_max >= 0 ? +I.reinstall_max : 2;
    const cur = os.find(o => o.id === PC.os) || {};
    b.innerHTML = `<div class="pcs-sec"><span>① ${L("Chọn Windows", "Choose Windows")} <b style="color:var(--gold-hi)">*</b></span><small>${L(`đổi được ${mx} lần trong lượt thuê`, `switchable ${mx}× per rental`)}</small></div>
      <div class="vps-opts">${os.map(o => { const [k0, k1] = osSplit(o.name || o.id); return `<button type="button" data-pcsos="${esc(o.id)}" class="${o.id === PC.os ? "on" : ""}" aria-pressed="${o.id === PC.os}">
        <small class="k0">${o.id === PC.os ? "✓ " : ""}${esc(k0)}</small><b>${esc(k1)}</b>
        <small class="${o.fast ? "fast" : "slow"}">${o.fast ? L("⚡ Có máy sẵn · giao ngay", "⚡ In stock · instant") : I.ready ? L("⏳ Cài theo yêu cầu · ~20 phút", "⏳ Installed on order · ~20 min") : L("⏳ Shop đang chuẩn bị máy", "⏳ Machine being prepared")}</small></button>`; }).join("")}</div>
      <div class="pcs-oshint ${cur.fast ? "fast" : "slow"}">${cur.fast ? L("⚡ Có máy sẵn bản này — thanh toán xong vào điều khiển được ngay.", "⚡ A machine with this version is ready — use it right after payment.")
