<style>
/* ===== VPS GPU (máy PC thật) — mua tự động · VPS của khách · đơn chờ cho admin (SQL v43) ===== */
.pcs-os{display:grid;gap:8px}
.pcs-os .vps-opts button.on{border-color:var(--sky);background:rgba(61,123,255,.18)}
.pcs-os .vps-opts small.fast{color:var(--ok)}
.pcs-os .vps-opts small.slow{color:var(--warn)}
.pcs-how{font-size:12.5px;line-height:1.55;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.pcs-how b{color:var(--fg)}
#modal.pcauto #m-vps,#modal.pcauto #m-more,#modal.pcauto .qty{display:none!important}
.pcs-card .m3m-nm small{font-weight:500;color:var(--muted);margin-left:6px}
.pcs-card .pcs-st{font-size:12.5px;line-height:1.45;color:var(--muted)}
.pcs-card .pcs-st b{color:var(--fg)}
.pcs-card .pcs-st.warn{color:var(--warn)}
.pcs-card .pcs-st.bad{color:var(--bad)}
.pcs-card .pcs-bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.pcs-card .pcs-bar i{display:block;height:100%;width:35%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--sky));animation:pcsrun 1.6s ease-in-out infinite}
@keyframes pcsrun{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
@media (prefers-reduced-motion:reduce){.pcs-card .pcs-bar i{animation:none;width:100%;opacity:.5}}
.pcs-dlg .vps-opts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.pcs-dlg .vps-opts button.on{border-color:var(--sky);background:rgba(61,123,255,.18)}
.pcs-done{display:grid;gap:10px;text-align:center}
.pcs-done .big{font-size:40px;line-height:1}
.pcs-done h3{margin:0}
.pcs-steps{display:grid;gap:6px;text-align:left;font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.pcs-adm{display:grid;gap:10px;margin-bottom:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--soft)}
.pcs-adm h4{margin:0;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pcs-adm .tbl td{vertical-align:top}
.pcs-adm .pcs-acts{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.pcs-wait{padding:10px 12px;border-radius:12px;background:rgba(255,107,129,.12);border:1px solid rgba(255,107,129,.45);color:var(--fg);font-size:13.5px;line-height:1.5}
.pcs-wait b{color:var(--bad)}
#pcs-waitbar{cursor:pointer;margin:0 0 10px}
.pcs-set{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px}
.pcs-set select,.pcs-set input[type=number]{max-width:260px}
.pcs-free{display:grid;gap:6px;max-height:320px;overflow:auto}
.pcs-free label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.pcs-free label:has(input:checked){border-color:var(--sky);background:rgba(61,123,255,.12)}
#pcsdlg{z-index:70}   /* hộp của phần VPS GPU nằm TRÊN bảng quản trị (z 60) khi admin bấm Bàn giao */
</style>
<script>
/* ===== VPS GPU tự động (SQL v43). Không có v43 → mọi phần dưới tự ẩn, cửa hàng chạy như cũ. ===== */
(() => {
  const $i = id => document.getElementById(id);
  const S = (v, n) => v == null || typeof v === "object" ? "" : String(v).slice(0, n || 80);
  const A = v => Array.isArray(v) ? v : [];
  const O = v => v && typeof v === "object" && !Array.isArray(v) ? v : {};
  const T = v => { const t = typeof v === "string" ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
  const me = () => { try { return typeof profile !== "undefined" && profile ? profile : null; } catch (e) { return null; } };
  const isAdm = () => { const u = me(); return !!u && u.role === "admin"; };
  const ERR = {
    NOT_AUTO: ["Sản phẩm này chưa bật giao máy tự động.", "Automatic delivery is off for this product."],
    BAD_OS: ["Chọn bản Windows.", "Choose a Windows version."], BAD_PLAN: ["Chọn thời gian thuê.", "Choose a rental period."],
    SLOW_DOWN: ["Bạn thao tác hơi nhanh — thử lại sau ít phút.", "Too many requests — try again in a few minutes."],
    NO_LEFT: ["Máy này đã hết lượt cài lại trong lượt thuê. Nhắn shop nếu cần thêm.", "No reinstalls left for this rental. Contact the shop."],
    BUSY: ["Máy đang cài Windows — chờ xong rồi thử lại.", "Windows is being installed — try again when it finishes."],
    EXPIRED: ["Máy đã hết hạn — gia hạn trước.", "This machine has expired — renew first."],
    NOT_ALLOWED: ["Máy này không thuộc tài khoản của bạn.", "This machine is not on your account."],
    PC_IN_USE: ["Máy này đang có khách còn hạn.", "This machine is rented by another customer."],
    CLOSED: ["Lượt thuê này đã kết thúc.", "This rental has ended."], NO_RENTAL: ["Không tìm thấy lượt thuê.", "Rental not found."],
    NOT_APPROVED: ["Máy chưa duyệt.", "Machine not approved."], SAME_PC: ["Khách đang dùng đúng máy này rồi.", "Already on this machine."],
    NO_PRODUCT: ["Không có sản phẩm này.", "No such product."], BAD_MAX: ["Số lần cài lại phải từ 0 đến 20.", "Reinstalls must be 0–20."]
  };
  const em = e => { const m = String((e && (e.message || e.error_description)) || e || ""); for (const k in ERR) if (m.includes(k)) return L(ERR[k][0], ERR[k][1]);
    try { return errMsg(e); } catch (x) { return m || L("Lỗi không rõ.", "Unknown error."); } };
  const missing = e => /does not exist|schema cache|Could not find|PGRST202/i.test(String((e && (e.message || e.code)) || ""));
  const left = iso => { const t = T(iso); return t === null ? null : t - Date.now(); };
  const PC = window.PCSHOP = { info: null, infoAt: 0, mine: null, mineAt: 0, adm: null, os: "", busy: false, dlg: null };

  // ---------------------------------------------------------------- thông tin bán (ai cũng xem được)
  async function info(force) {
    if (!force && PC.info && Date.now() - PC.infoAt < 30000) return PC.info;
    try { const { data, error } = await sb.rpc("pc_shop_info"); PC.info = error ? { on: false, miss: missing(error) } : O(data); }
    catch (e) { PC.info = { on: false }; }
    PC.infoAt = Date.now(); return PC.info;
  }
  const autoP = p => !!p && !!PC.info && PC.info.on === true && S(PC.info.product, 40) === S(p.id, 40);

  // ---------------------------------------------------------------- MUA: hộp "Mua sản phẩm" của VPS GPU tự động
  function osBox() {
    let b = $i("pcs-os");
    if (!b) { b = document.createElement("div"); b.id = "pcs-os"; b.className = "pcs-os"; $i("m-plans-box").after(b); }
    return b;
  }
  function osPaint() {
    const b = osBox(), I = O(PC.info), os = A(I.os);
    if (!os.some(o => o.id === PC.os)) PC.os = (os.find(o => o.fast) || os[0] || {}).id || "";
    const mx = +I.reinstall_max >= 0 ? +I.reinstall_max : 2;
    b.innerHTML = `<span class="hint">${L("Chọn bản Windows", "Choose Windows")} <b style="color:var(--gold-hi)">*</b></span>
      <div class="vps-opts">${os.map(o => `<button type="button" data-pcsos="${esc(o.id)}" class="${o.id === PC.os ? "on" : ""}"><b>${esc(S(o.name, 60))}</b>
        <small class="${o.fast ? "fast" : "slow"}">${o.fast ? L("⚡ Có máy sẵn · giao ngay", "⚡ In stock · instant") : I.ready ? L("⏳ Cài theo yêu cầu · ~20 phút", "⏳ Installed on order · ~20 min") : L("⏳ Shop đang chuẩn bị máy", "⏳ Machine being prepared")}</small></button>`).join("")}</div>
      <div class="pcs-how">✅ ${L("Thanh toán xong, hệ thống <b>tự giao máy</b> và cài đúng bản Windows bạn chọn.", "After payment the system <b>assigns a machine</b> and installs the Windows you chose.")}
        ${L("Điều khiển ngay trên <b>web · app điện thoại · app máy tính</b>, như máy đám mây.", "Control it from the <b>web · phone app · PC app</b>, just like a cloud phone.")}
        ${L(`Được tự <b>cài lại / đổi Windows ${mx} lần</b> mỗi lượt thuê.`, `<b>${mx} free reinstalls / Windows switches</b> per rental.`)}</div>`;
  }
  function autoMode(on) {
    const m = $i("modal"); if (!m) return;
    m.classList.toggle("pcauto", !!on);
    const b = $i("pcs-os"); if (b) b.hidden = !on;
    if (on) { $i("m-qty").value = 1; osPaint(); try { upd(); } catch (e) {} }
  }
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("[data-pcsos]"); if (!b) return;
    PC.os = b.dataset.pcsos; osPaint(); const er = $i("m-err"); if (er) er.textContent = "";
  });
  const _open = window.openBuy, _do = window.doBuy;
  if (typeof _open === "function" && typeof _do === "function") {
    window.openBuy = function (id) {
      _open.apply(this, arguments);
      let p = null; try { p = selP(); } catch (e) {}
      autoMode(autoP(p));
      if (p && p.cat === "vps") info(true).then(() => { let q = null; try { q = selP(); } catch (e) {} if (q && q.id === p.id && !$i("modal").hidden) autoMode(autoP(q)); });
    };
    const ok = $i("m-ok");
    if (ok) ok.onclick = () => { let p = null; try { p = selP(); } catch (e) {} return autoP(p) ? buy(p) : _do(); };
  }
  async function buy(p) {
    if (!me()) { try { closeBuy(); openAuth("login"); } catch (e) {} return; }
    const err = $i("m-err");
    if (!PC.os) { err.textContent = L("Chọn bản Windows trước khi thanh toán.", "Choose Windows before paying."); return; }
    const tot0 = unitPrice(p);
    await busy($i("m-ok"), async () => {
      if (!(await prmEnsure("buy", "m-err"))) return;
      const tot = prmPrice("buy", tot0), code = prmCode("buy");
      if (me().balance < tot) { closeBuy(); openTopup(Math.max(+SITE.minTop || 10000, Math.ceil((tot - me().balance) / 1000) * 1000)); return; }
      const days = plansOf(p).length ? selDays : null;
      const { data, error } = await sb.rpc("pc_buy", { p_product: p.id, p_days: days, p_os: PC.os, ...(code ? { p_promo: code } : {}) });
      if (error) { try { prmFail("buy", error); } catch (e) {} err.textContent = em(error); return; }
      closeBuy();
      await Promise.all([loadProfile(), loadProducts(), mine(true), info(true)]).catch(() => {});
      try { renderUser(); } catch (e) {}
      done(O(data), p, days);
    });
  }
  function dlg(html) {
    let m = $i("pcsdlg");
    if (!m) { m = document.createElement("div"); m.className = "modal"; m.id = "pcsdlg"; m.hidden = true; document.body.appendChild(m);
      m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-pcsx]")) m.hidden = true; }); }
    m.innerHTML = `<div class="dlg pcs-dlg" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; return m;
  }
  function done(r, p, days) {
    const act = r.state === "active", osn = S((A(O(PC.info).os).find(o => o.id === PC.os) || {}).name, 60) || PC.os;
    dlg(`<div class="pcs-done"><div class="big">${act ? "🎉" : "⏳"}</div>
      <h3>${act ? L("Đã giao máy cho bạn", "Your machine is ready") : L("Đã nhận đơn — shop đang chuẩn bị máy", "Order received — preparing your machine")}</h3>
      <div class="hint">${esc(osn)} · ${days ? days + L(" ngày", " days") : ""}${act ? " · " + L("máy", "machine") + " <b>" + esc(S(r.name, 40)) + "</b>" : ""}</div>
      <ol class="pcs-steps">${act ? (r.reinstall
        ? `<li>${L("Máy đang tự cài Windows cho bạn (~15–30 phút) — theo dõi ở mục <b>VPS GPU của bạn</b> đầu trang chủ.", "Windows is being installed (~15–30 min) — follow it under <b>Your GPU VPS</b> on the home page.")}</li><li>${L("Cài xong bấm <b>▶ Điều khiển</b> để vào máy.", "Then tap <b>▶ Control</b> to use it.")}</li>`
        : `<li>${L("Máy đã sẵn sàng — bấm <b>▶ Điều khiển</b> để vào máy ngay.", "Ready now — tap <b>▶ Control</b>.")}</li>`)
        : `<li>${L("Tiền đã trừ, đơn đã ghi. Có máy là hệ thống <b>tự giao + cài Windows</b> (thường vài phút).", "Paid and recorded. As soon as a machine is free it is <b>assigned and installed automatically</b> (usually a few minutes).")}</li><li>${L("Theo dõi ở mục <b>VPS GPU của bạn</b> đầu trang chủ — không cần nhắn shop.", "Follow it under <b>Your GPU VPS</b> on the home page — no need to message the shop.")}</li>`}
        <li>${L("Hạn thuê tính từ lúc giao máy.", "Your rental time starts when the machine is assigned.")}</li></ol>
      <div class="acts" style="justify-content:center">${act && !r.reinstall ? `<a class="btn" href="/play.html?pc=${encodeURIComponent(S(r.pc, 40))}">▶ ${L("Điều khiển", "Control")}</a>` : ""}
        <button class="btn ghost" type="button" data-pcsx="1" data-pcsgo="1">${L("Xem VPS GPU của bạn", "See your GPU VPS")}</button></div></div>`);
  }
  document.addEventListener("click", e => { if (e.target.closest && e.target.closest("[data-pcsgo]")) { const s = $i("pcs-mine"); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); } });

  // ---------------------------------------------------------------- "VPS GPU của bạn" (đầu trang chủ, dưới máy đám mây)
  function mineBox() {
    let s = $i("pcs-mine");
    if (!s) {
      const after = $i("m3-mine"); if (!after) return null;
      s = document.createElement("section"); s.className = "wrap m3-mine"; s.id = "pcs-mine"; s.hidden = true; s.setAttribute("aria-labelledby", "pcs-mine-h");
      s.innerHTML = `<div class="m3m-box"><div class="m3m-head"><h2 id="pcs-mine-h"><span aria-hidden="true">🖥️</span> <span>${L("VPS GPU của bạn", "Your GPU VPS")}</span><small id="pcs-mine-n"></small></h2>
        <div class="m3m-hacts"><button class="btn sm" type="button" id="pcs-mine-new">+ ${L("Thuê thêm", "Rent another")}</button></div></div>
        <div class="m3m-list" id="pcs-mine-list"></div></div>`;
      after.after(s);
      $i("pcs-mine-new").onclick = () => { const id = S(O(PC.info).product, 40) || S(O(PC.mine).product, 40); try { if (id && P.some(p => p.id === id)) { openBuy(id); return; } } catch (e) {} location.hash = "#shop"; };
    }
    return s;
  }
  async function mine(force) {
    if (!me()) { PC.mine = null; mineRender(); return; }
    if (!force && PC.mine && Date.now() - PC.mineAt < 20000) { mineRender(); return; }
    try { const { data, error } = await sb.rpc("pc_my_vps"); if (!error) { PC.mine = O(data); PC.mineAt = Date.now(); } else if (missing(error)) PC.mine = null; } catch (e) {}
    mineRender();
  }
  function stateOf(it) {
    const pc = O(it.pc), job = O(pc.job), ms = left(it.until);
    if (it.state === "waiting") return ["wait", "⏳ " + L("Đang chờ máy", "Waiting for a machine"), L("Shop đã nhận đơn. Có máy là tự giao + cài Windows — không cần nhắn shop.", "Order received. A machine will be assigned and installed automatically.")];
    if (it.state === "cancelled") return ["end", "✕ " + L("Đã huỷ", "Cancelled"), L("Đơn đã huỷ. Tiền hoàn (nếu có) đã cộng vào số dư.", "Order cancelled. Any refund went to your balance.")];
    if (it.state === "ended") return ["end", "■ " + L("Đã kết thúc", "Ended"), ""];
    if (job.state) return ["inst", "⚙️ " + L("Đang cài Windows", "Installing Windows"), job.state === "sent" ? L("Máy đang cài " + S(job.os, 12).toUpperCase() + " (15–30 phút). Xong là vào được.", "Installing " + S(job.os, 12).toUpperCase() + " (15–30 min).") : L("Máy sắp khởi động lại để cài Windows…", "The machine will restart to install Windows…")];
    if (ms !== null && ms <= 0) return ["exp", "⛔ " + L("Hết hạn", "Expired"), pc.off ? L("Máy đã tự tắt. Gia hạn để dùng tiếp — shop bật lại máy cho bạn.", "The machine has shut down. Renew and the shop will turn it back on.") : L("Gia hạn để dùng tiếp.", "Renew to keep using it.")];
    if (!pc.online) return ["off", "○ " + L("Máy đang tắt / mất mạng", "Offline"), L("Máy chưa báo về. Nếu lâu quá 5 phút, nhắn shop kèm tên máy.", "Not reporting. If it lasts over 5 min, contact the shop with the machine name.")];
    if (O(pc.last_job).state === "failed") return ["warn", "⚠️ " + L("Cài lại chưa xong", "Reinstall failed"), L("Lần cài lại vừa rồi lỗi — nhắn shop kèm tên máy.", "The last reinstall failed — contact the shop.")];
    return ["run", "● " + L("Sẵn sàng", "Ready"), ""];
  }
  function card(it) {
    const pc = O(it.pc), st = stateOf(it), ms = left(it.until), max = +O(PC.mine).reinstall_max || 2;
    const soon = st[0] === "run" && ms !== null && ms < 864e5;
    const canCtl = st[0] === "run" || st[0] === "warn";
    const gpu = A(pc.gpus).map(g => S(g, 40)).filter(Boolean)[0] || "";
    const spec = [S(it.os_name, 40), gpu, pc.ram_gb ? Math.round(+pc.ram_gb) + "GB RAM" : ""].filter(Boolean).join(" · ");
    const acts = it.rental === null && !it.pc ? "" : [
      pc.id ? (canCtl ? `<a class="btn sm" href="/play.html?pc=${encodeURIComponent(S(pc.id, 40))}">▶ ${L("Điều khiển", "Control")}</a>` : `<button class="btn sm" type="button" disabled>▶ ${L("Điều khiển", "Control")}</button>`) : "",
      pc.id && canCtl ? `<button class="btn ghost sm" type="button" data-pcsapp="${esc(S(pc.id, 40))}" title="${esc(L("Mở bằng app máy tính / app Android", "Open in the PC / Android app"))}">📲 App</button>` : "",
      it.rental && it.state === "active" && pc.id ? `<button class="btn ghost sm" type="button" data-pcsre="${esc(S(pc.id, 40))}"${st[0] === "inst" || st[0] === "exp" || +it.left < 1 ? " disabled" : ""} title="${esc(L("Cài lại / đổi bản Windows", "Reinstall / switch Windows"))}">🔄 ${L("Cài lại", "Reinstall")} <small>${+it.left || 0}/${max}</small></button>` : "",
      it.rental && it.state === "active" && pc.id ? `<button class="btn ghost sm" type="button" data-pcsrenew="${esc(S(pc.id, 40))}">⏱ ${L("Gia hạn", "Renew")}</button>` : ""
    ].join("");
    return `<div class="m3m-card pcs-card${st[0] === "run" ? " run" : ""}${soon || st[0] === "exp" || st[0] === "wait" ? " soon" : ""}">
      <div class="m3m-top"><span class="pill${st[0] === "run" ? " ok" : st[0] === "exp" || st[0] === "warn" ? " bad" : ""}">${esc(st[1])}</span>${pc.code ? `<span class="pill">№ ${esc(S(pc.code, 24))}</span>` : ""}</div>
      <b class="m3m-nm">${esc(S(pc.name, 40) || L("VPS GPU", "GPU VPS"))}${it.days ? `<small>${+it.days} ${L("ngày", "days")}</small>` : ""}</b>
      <small class="m3m-spec">${esc(spec)}</small>
      ${st[0] === "inst" || st[0] === "wait" ? '<div class="pcs-bar" aria-hidden="true"><i></i></div>' : ""}
      ${st[2] ? `<div class="pcs-st${st[0] === "exp" || st[0] === "warn" ? " bad" : st[0] === "off" ? " warn" : ""}">${esc(st[2])}</div>` : ""}
      ${it.state === "active" && ms !== null && ms > 0 ? `<div class="m3m-exp${soon ? " warn" : ""}">${L("Còn", "")} <b data-cd="${esc(S(it.until, 40))}">${typeof cdText === "function" ? cdText(it.until) : ""}</b>${L("", " left")}</div>` : ""}
      <div class="m3m-acts">${acts}</div></div>`;
  }
  function mineRender() {
    const s = mineBox(); if (!s) return;
    const items = A(O(PC.mine).items);
    s.hidden = !me() || !items.length; if (s.hidden) return;
    const run = items.filter(x => x.state === "active").length, wait = items.filter(x => x.state === "waiting").length;
    $i("pcs-mine-n").textContent = L(`${run} máy đang thuê`, `${run} active`) + (wait ? L(` · ${wait} đang chờ máy`, ` · ${wait} waiting`) : "");
    $i("pcs-mine-list").innerHTML = items.map(it => { try { return card(it); } catch (e) { return ""; } }).join("");
    const busyNow = items.some(x => x.state === "waiting" || O(O(x.pc).job).state);
    clearTimeout(PC.mt); PC.mt = setTimeout(() => mine(true), busyNow ? 15000 : 60000);
  }
  // ---- cài lại / đổi Windows
  document.addEventListener("click", async e => {
    const b = e.target.closest && e.target.closest("[data-pcsre],[data-pcsrenew],[data-pcsreos],[data-pcsgo2],[data-pcsplan],[data-pcsrnew],[data-pcsapp]"); if (!b) return;
    if (b.dataset.pcsapp) return appOpen(b.dataset.pcsapp);
    if (b.dataset.pcsre) return reOpen(b.dataset.pcsre);
    if (b.dataset.pcsrenew) return renewOpen(b.dataset.pcsrenew);

  function handOpen(r) {
    const fr = A(O(PC.adm).free); PC.hr = r;
    const ok = m => m.online ? "● online" : "○ offline (lệnh chờ máy bật)";
    dlg(`<h3 style="margin:0">${r.state === "waiting" ? "🤝 Bàn giao máy" : "↔ Đổi máy"} cho ${esc(S(O(r.user).username, 40))}</h3>
      <div class="hint">${esc(S(r.os_name, 40))} · ${+r.days} ngày. Chỉ hiện máy <b>trống</b> (Sẵn sàng, chưa gán khách, không đang cài).</div>
      <div class="pcs-free">${fr.length ? fr.map((m, i) => `<label><input type="radio" name="pcs-hpc" value="${esc(m.id)}"${i === 0 ? " checked" : ""}><span><b>${esc(S(m.name, 40))}</b>${m.code ? " № " + esc(S(m.code, 24)) : ""}<br><small class="hint">${ok(m)} · đang chạy ${esc(S(m.os, 12).toUpperCase() || "?")} · ${m.clean ? "✓ sạch (vừa cài)" : "đã có khách dùng → sẽ xoá sạch"}${m.clean && m.os === r.os ? " · <b>giao ngay, không cần cài</b>" : ""}</small></span></label>`).join("")
        : '<div class="hint">Không có máy trống. Đặt 1 máy về trạng thái <b>Sẵn sàng</b> (bỏ khách + hạn cũ bằng 🧼 Bàn giao ở bảng máy) rồi thử lại.</div>'}</div>
      <label class="hint"><input type="checkbox" id="pcs-h-re"> Luôn cài lại Windows sạch (kể cả máy đã sạch đúng bản)</label>
      <div class="err" id="pcs-h-err"></div>
      <div class="acts"><button class="btn ghost" type="button" data-pcsx="1">Huỷ</button><button class="btn" type="button" id="pcs-h-go"${fr.length ? "" : " disabled"}>Bàn giao</button></div>`);
    $i("pcs-h-go").onclick = async e => {
      const pid = (document.querySelector('input[name="pcs-hpc"]:checked') || {}).value; if (!pid) return;
      const res = await admCall("pc_admin_handover", { p_rental: +PC.hr.id, p_pc: pid, p_reinstall: $i("pcs-h-re").checked ? true : null }, "", e.currentTarget);
      if (res) { $i("pcsdlg").hidden = true; toast(O(res).reinstall ? `Đã giao ${S(O(res).name, 40)} — máy đang tự cài ${S(PC.hr.os, 12).toUpperCase()}.` : `Đã giao ${S(O(res).name, 40)} — khách vào được ngay.`); }
    };
  }
  // 🧼 Bàn giao ở bảng máy: máy đang thuộc 1 lượt thuê → kết thúc lượt đó
  PC.releasePc = async id => {
    if (!isAdm()) return;
    const { data, error } = await sb.rpc("pc_admin_rentals"); if (error) return;
    const r = A(O(data).rentals).find(x => x.state === "active" && O(x.pc).id === id);
    if (r) { await sb.rpc("pc_admin_rental_end", { p_rental: +r.id, p_refund: false }); toast("Lượt thuê VPS GPU của " + S(O(r.user).username, 40) + " đã kết thúc — máy về kho."); }
    adm(true);
  };

  // ---------------------------------------------------------------- nhịp: theo trạng thái đăng nhập
  let lastUid = null;
  function tick(force) {
    const u = me(), uid = u ? u.id : null;
    if (uid !== lastUid) { lastUid = uid; PC.mine = null; PC.adm = null; force = true; }
    mine(force); if (isAdm()) adm(force); else admRender();
  }
  info().then(() => { try { if (!$i("modal").hidden) { const p = selP(); autoMode(autoP(p)); } } catch (e) {} });
  setInterval(() => { if (!document.hidden) tick(false); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(false); });
  const _ru = window.renderUser;
  if (typeof _ru === "function") window.renderUser = function () { const r = _ru.apply(this, arguments); try { tick(false); } catch (e) {} return r; };
  setTimeout(() => tick(true), 1500);
})();
</script>
