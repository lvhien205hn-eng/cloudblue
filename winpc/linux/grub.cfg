# CloudBlue PC — menu GRUB trên phân vùng cứu hộ: mở thẳng file ISO CachyOS (không cần USB) và chạy bộ cài không người cb-install.sh.
# Phân vùng chứa ISO: job.cfg (WinPE ghi lúc giao việc) đặt cbdev=UUID=<số seri NTFS chữ HOA>; không có thì tìm theo nhãn CBRECOVERY.
# KHÔNG thêm systemd.unit=…: systemd.run= tự đặt default.target = kernel-command-line.target — systemd.unit= ghi đè nó → script không chạy
# (CI linux-check #2: máy sống lên tới "Basic System" rồi đứng 20 phút). Mạng / khoá pacman: cb-install.sh tự bật multi-user.target.
set timeout=3
set default=0
insmod part_gpt
insmod part_msdos
insmod ntfs
insmod iso9660
insmod loopback
insmod linux
insmod all_video
set cbiso=/cb/linux/cachyos.iso
set cbdev=LABEL=CBRECOVERY
set cbextra=""
if [ -f /cb/linux/job.cfg ]; then
    source /cb/linux/job.cfg
fi
loopback loop $cbiso
set cbk=vmlinuz-linux-cachyos-lts
set cbi=initramfs-linux-cachyos-lts.img
if [ ! -f (loop)/arch/boot/x86_64/$cbk ]; then
    set cbk=vmlinuz-linux-cachyos
    set cbi=initramfs-linux-cachyos.img
fi
menuentry "CloudBlue: cai CachyOS (khong can nguoi)" {
    set gfxpayload=keep
    linux (loop)/arch/boot/x86_64/$cbk archisobasedir=arch img_dev=$cbdev img_loop=$cbiso copytoram=n cow_spacesize=4G systemd.run=\"/usr/bin/bash /run/archiso/img_dev/cb/linux/cb-install.sh\" systemd.run_success_action=none systemd.run_failure_action=none module_blacklist=pcspkr nvme_load=yes $cbextra
    initrd (loop)/arch/boot/x86_64/$cbi
}
menuentry "Khoi dong lai" {
    reboot
}
