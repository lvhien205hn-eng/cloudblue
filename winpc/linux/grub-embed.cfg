# CloudBlue PC — cấu hình NHÚNG trong grubx64.efi (dựng bằng grub-mkstandalone trên GitHub CI, xem .github/workflows/linux-check.yml).
# Chỉ đi tìm phân vùng có /cb/linux/grub.cfg (phân vùng cứu hộ CBRECOVERY) rồi chạy menu nằm ở đó → sửa menu không phải dựng lại GRUB.
insmod part_gpt
insmod part_msdos
insmod fat
insmod ntfs
insmod iso9660
search --no-floppy --set=root --file /cb/linux/grub.cfg
if [ -n "$root" ]; then
    configfile /cb/linux/grub.cfg
fi
echo "CloudBlue: khong thay /cb/linux/grub.cfg (phan vung cuu ho CBRECOVERY) tren o nao - may se khoi dong lai sau 30 giay."
sleep 30
reboot
